      req.onsuccess = () => resolve(req.result || null);
      req.onerror   = () => reject(req.error);
    });
    db.close();
    return resultado;
  } catch (err) {
    return null;
  }
}

// Apaga só o registo de um tipo ('super' ou 'arm') — usado quando um
// ficheiro guardado se revela ilegível ao retomar (ver tentarCarregarGuardado).
async function apagarFicheiroDB(tipo) {
  try {
    const db = await abrirFicheirosDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(tipo);
      tx.oncomplete = resolve;
      tx.onerror    = () => reject(tx.error);
    });
    db.close();
  } catch (err) {
    console.warn('Não foi possível apagar o ficheiro guardado:', err);
  }
}

// Apaga tudo o que estiver guardado — usado pelo link "Esquecer ficheiros".
async function apagarFicheirosDB() {
  try {
    const db = await abrirFicheirosDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).clear();
      tx.oncomplete = resolve;
      tx.onerror    = () => reject(tx.error);
    });
    db.close();
  } catch (err) {
    console.warn('Não foi possível apagar os ficheiros guardados:', err);
  }
}

// Ao abrir a app (ou dar refresh), tenta retomar automaticamente a partir
// do que estiver guardado em IndexedDB — sem pedir upload outra vez. Se só
// houver um dos dois ficheiros guardados, o outro continua a ser pedido
// normalmente no ecrã de upload (só o cartão em falta fica por preencher).
// Qualquer falha aqui cai em segurança para o comportamento anterior a
// esta funcionalidade: mostrar o ecrã de upload vazio.
async function tentarCarregarGuardado() {
  const statusEl = document.getElementById('auto-load-status');
  try {
    const [regSuper, regArm] = await Promise.all([lerFicheiroDB('super'), lerFicheiroDB('arm')]);
    if (!regSuper && !regArm) return;

    statusEl.style.display = 'block';
    // Deixa o browser pintar a mensagem "A carregar dados guardados…"
    // antes de arrancar com a leitura, que é síncrona e pode bloquear
    // meio segundo com ficheiros grandes. Sem esta pausa, a mensagem era
    // posta e tirada dentro do mesmo fotograma — nunca chegava a aparecer,
    // e o ecrã parecia congelado sem explicação.
    await new Promise(requestAnimationFrame);
    // Se um ficheiro guardado já não for legível (ex: foi guardado por uma
    // versão anterior da app, que ainda não validava o cabeçalho), apaga-se
    // o registo — senão o mesmo aviso voltava a aparecer em todos os
    // arranques seguintes, sem forma óbvia de o calar.
    if (regSuper && !processFileBuffer(regSuper.arrayBuffer, 'super', regSuper.fname)) apagarFicheiroDB('super');
    if (regArm   && !processFileBuffer(regArm.arrayBuffer, 'arm', regArm.fname))       apagarFicheiroDB('arm');
  } catch (err) {
    console.warn('Não foi possível retomar os ficheiros guardados anteriormente:', err);
  } finally {
    statusEl.style.display = 'none';
  }
}

// Link "Esquecer ficheiros": apaga o que estiver guardado no dispositivo e
// recarrega a app, voltando ao ecrã de upload vazio. Um simples reload é a
// forma mais segura de repor todo o estado em memória (superMap, armMap,
// modo de pesquisa, etc.) sem ter de o fazer campo a campo.
async function esquecerFicheiros() {
  const confirmado = confirm('Esquecer os ficheiros guardados neste dispositivo? Da próxima vez vai ser preciso carregá-los outra vez.');
  if (!confirmado) return;
  await apagarFicheirosDB();
  location.reload();
}

window.addEventListener('DOMContentLoaded', tentarCarregarGuardado);


let uploadLabels = { super: '', arm: '' };

function markLoaded(zoneId, countId, fname, info, tipo) {
  const zone = document.getElementById(zoneId);
  zone.classList.add('loaded');
  // O cartão continua clicável depois de carregado. Antes ficava com
  // onclick = null, o que tornava o "Trocar ficheiros" inútil: a zona de
  // upload reabria, mas nenhum dos dois cartões respondia ao clique, por
  // isso não havia forma nenhuma de substituir um ficheiro sem antes
  // "Esquecer ficheiros" e voltar a carregar os dois.
  const countEl = document.getElementById(countId);
  const label = fname.split('/').pop() + ' — ' + info;
  countEl.textContent = '✓ ' + label;
  countEl.style.display = 'block';
  uploadLabels[tipo] = label;
}

function checkReady() {
  if (superLoaded && armLoaded) {
    const inp = document.getElementById(activeSearchInputId());
    document.getElementById('mode-btn-artigo').disabled = false;
    document.getElementById('mode-btn-super').disabled = false;
    document.getElementById('mode-btn-etiqueta').disabled = false;
    inp.disabled = false;
    document.getElementById('search-input-artigo').disabled = false;
    document.getElementById('search-input-super').disabled = false;
    document.getElementById('search-input-etiqueta').disabled = false;
    inp.focus();
    updateScanUI();
    // Com os dois ficheiros carregados, a zona de upload deixa de fazer
    // falta no ecrã — colapsa numa barra fina para dar mais espaço aos
    // resultados. "Trocar ficheiros" reabre-a sem perder os dados já lidos.
    document.getElementById('ub-files').textContent = uploadLabels.super + '  ·  ' + uploadLabels.arm;
    document.getElementById('upload-section').style.display = 'none';
    document.getElementById('upload-bar').style.display = 'flex';
  }
}

// ── Search mode (Artigos vs Supermercados/Serviços) ─────
// Cada modo tem a sua própria caixa de texto; só uma está visível de cada
// vez. Trocar de modo limpa o texto e os resultados do modo anterior, para
// não ficar a mostrar resultados de um tipo de pesquisa diferente.
let searchMode = 'artigo';

// No modo "Supermercados / Serviços", o resultado passa a ser escolhido
// por badge (em vez de mostrar logo todas as fichas encontradas). Esta
// variável guarda QUAL supermercado/serviço está escolhido — formato
// "tipo|cod|nome" — e é nulo quando ainda não há escolha.
let selectedIndexKey = null;

// Modo "Etiqueta": fluxo de dois passos — primeiro escolher o supermercado
// (etqSuperKey, formato "cod|nome"), depois escolher os artigos
// (etqArtigosSel, conjunto de códigos). A posição da etiqueta vem do par
// (supermercado, artigo), por isso são precisos os dois; o
// código/descrição/preço/stockável vêm do artigo (ARM).
//
// Desde a v1.29.0 o passo do artigo é de escolha MÚLTIPLA: cada clique num
// artigo marca/desmarca, saem tantas etiquetas quantos os artigos marcados,
// e com dois ou mais aparece o botão "Imprimir etiquetas (N)" que as manda
// todas de uma vez para uma folha A4 (o mesmo que já existia no índice de
// supermercado). Antes só se podia ter um artigo escolhido de cada vez.
let etqSuperKey  = null;
let etqArtigosSel = new Set();
// O que está desenhado neste momento (supermercado + artigos marcados),
// usado pelo botão "Imprimir etiquetas (N)".
let etqEtiquetasAtuais = null;

function activeSearchInputId() {
  if (searchMode === 'artigo')   return 'search-input-artigo';
  if (searchMode === 'etiqueta') return 'search-input-etiqueta';
  return 'search-input-super';
}

// Botão de câmara só faz sentido no modo "Artigos" (é onde se pesquisa por
// código de artigo, e os códigos são só números). Fica ainda por cima
// desativado enquanto os dois ficheiros não estiverem carregados, tal como
// a caixa de pesquisa.
function updateScanUI() {
  const btn = document.getElementById('btn-scan');
  btn.style.display = searchMode === 'artigo' ? 'inline-flex' : 'none';
  btn.disabled = !(superLoaded && armLoaded);
}

// Os três modos são simétricos: cada um tem um botão e uma caixa de texto
// própria. Esta função é a ÚNICA que mexe nessa parte da UI — antes a
// mesma lógica estava repetida em setSearchMode e nos dois saltos entre
// modos (irParaSupermercadoNoIndice / irParaArtigoNoIndice), e essas duas
// cópias só conheciam os modos "artigo" e "super": saltar a partir do
// modo Etiqueta deixava o botão "Etiqueta" marcado como ativo e a sua
// caixa de texto visível ao lado da caixa do modo de destino.
function aplicarModoUI(mode) {
  searchMode = mode;
  ['artigo', 'super', 'etiqueta'].forEach(m => {
    document.getElementById('mode-btn-' + m).classList.toggle('active', m === mode);
    document.getElementById('search-input-' + m).style.display = m === mode ? 'block' : 'none';
  });
  hideOcrMsg();
  updateScanUI();
  // O botão de limpar acompanha a caixa que está à vista: cada modo tem o
  // seu próprio texto, por isso o "x" tem de refletir o texto DESTE modo.
  const inp = document.getElementById(activeSearchInputId());
  document.getElementById('btn-clear').style.display = inp.value.trim() ? 'inline-flex' : 'none';
}

function setSearchMode(mode) {
  if (mode === searchMode) return;
  aplicarModoUI(mode);

  // Cada modo mantém o seu próprio texto e (no caso de "Supermercados /
  // Serviços") a sua seleção — não se limpa nada ao trocar de modo. Voltar
  // a um modo mostra outra vez o que lá estava, tal como se nunca se tivesse
  // saído dele.
  const inp = document.getElementById(activeSearchInputId());
  if (!inp.disabled) inp.focus();
  doSearch();
}

// Enter/Espaço num elemento com role="button" (os cartões de upload) faz
// o mesmo que um clique — é o que se espera de qualquer botão, e é o que
// os leitores de ecrã anunciam. preventDefault no Espaço evita que a
// página faça scroll ao mesmo tempo.
function ativarPorTeclado(ev, el) {
  if (ev.key !== 'Enter' && ev.key !== ' ' && ev.key !== 'Spacebar') return;
  ev.preventDefault();
  el.click();
}

// Reabre a zona de upload para permitir trocar um ou os dois ficheiros.
// Não apaga os dados já carregados: se só se substituir um ficheiro, o
// outro continua disponível para pesquisa.
function showUploadSection() {
  document.getElementById('upload-section').style.display = 'block';
  document.getElementById('upload-bar').style.display = 'none';
}

// Remove acentos para tornar a comparação mais tolerante (ex: "Povoa"
// encontra "Póvoa"). Também baixa para minúsculas.
function normaliza(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// ── Search ─────────────────────────────────────────────
function getNome(cod) {
  return (superMap[cod] && superMap[cod].nome) || (armMap[cod] && armMap[cod].descArtigo) || '';
}

// ── Índice de pesquisa (pré-calculado) ──────────────────
// normaliza() faz um normalize('NFD') + regex por cada texto comparado.
// Feito ao vivo, isso significava repetir esse trabalho para TODOS os
// artigos (e, no modo Supermercados, para todos os supermercados e
// serviços de cada artigo) a CADA tecla premida — dezenas de milhares de
// operações por letra em ficheiros reais, o que dava a sensação de a app
// "engasgar" a escrever no telemóvel.
//
// Aqui calcula-se cada texto normalizado UMA vez e reutiliza-se em todas
// as pesquisas seguintes. O índice é construído à primeira pesquisa depois
// de carregar dados (não no carregamento em si, para não atrasar o arranque)
// e deitado fora sempre que um ficheiro é (re)carregado.
let indicePesquisa = null;

function invalidarIndicePesquisa() {
  indicePesquisa = null;
}

function garantirIndicePesquisa() {
  if (indicePesquisa) return indicePesquisa;
  const cods = [...new Set([...Object.keys(superMap), ...Object.keys(armMap)])];
  const artigos = new Map();
  for (const cod of cods) {
    artigos.set(cod, { codNorm: normaliza(cod), nomeNorm: normaliza(getNome(cod)) });
  }
  // Cada supermercado/serviço aparece repetido em muitos artigos, mas o
  // texto normalizado é o mesmo — guarda-se por nome+código, uma só vez.
  const locais = new Map();
  const normalizarLista = lista => {
    for (const sv of lista || []) {
      const chave = sv.cod + '|' + sv.nome;
      if (!locais.has(chave)) locais.set(chave, { nomeNorm: normaliza(sv.nome), codNorm: normaliza(sv.cod) });
    }
  };
  for (const cod of Object.keys(superMap)) {
    normalizarLista(superMap[cod].supermercados);
    normalizarLista(superMap[cod].servicos);
  }
  indicePesquisa = { cods, artigos, locais };
  return indicePesquisa;
}

// Um supermercado/serviço bate com a pesquisa se o termo aparecer no nome
// ou no código — usando os textos já normalizados do índice.
function localBate(sv, q) {
  const norm = garantirIndicePesquisa().locais.get(sv.cod + '|' + sv.nome);
  if (!norm) return false;
  return (norm.nomeNorm && norm.nomeNorm.includes(q)) || (norm.codNorm && norm.codNorm.includes(q));
}

// Devolve os supermercados associados ao artigo que batem com o termo de
// pesquisa (código ou descrição). Ao contrário de um simples true/false,
// devolve os próprios supermercados porque o modo "Supermercados / Serviços"
// precisa de saber QUAL supermercado bateu, para construir o índice.
function supersQueBatem(cod, q) {
  const supers = (superMap[cod] && superMap[cod].supermercados) || [];
  return supers.filter(sv => localBate(sv, q));
}

// Devolve os serviços associados ao artigo que batem com o termo de
// pesquisa (código ou descrição). Mesma lógica de supersQueBatem.
function servicosQueBatem(cod, q) {
  const servicos = (superMap[cod] && superMap[cod].servicos) || [];
  return servicos.filter(sv => localBate(sv, q));
}

// Modo "Artigos": encontra só por código ou descrição do artigo — nunca
// por supermercado ou serviço.
function matchArtigo(cod, q) {
  const norm = garantirIndicePesquisa().artigos.get(cod);
  if (!norm) return false;
  return norm.codNorm.includes(q) || norm.nomeNorm.includes(q);
}

// Constrói o índice de supermercados que batem com a pesquisa. Cada
// supermercado encontrado agrupa todos os artigos que lá existem, com o
// respetivo tipo de caixa + quantidade (já é a Quantidade Total máxima
// desse tipo de caixa NESSE supermercado, porque superMap[].caixas já vem
// agregado por (tipo de caixa, supermercado) desde o carregamento do
// ficheiro — ver aggregateCaixas) e a posição em armazém.
function buildSupermercadoIndex(q) {
  const idx = new Map(); // chave: cod+nome do supermercado
  Object.keys(superMap).forEach(cod => {
    supersQueBatem(cod, q).forEach(sv => {
      const key = sv.cod + '|' + sv.nome;
      if (!idx.has(key)) idx.set(key, { cod: sv.cod, nome: sv.nome, grupo: sv.grupo, artigos: [] });
      idx.get(key).artigos.push({
        cod,
        nome: getNome(cod),
        caixas: (superMap[cod].caixas || []).filter(c => c.superNome === sv.nome),
        posicao: sv.posicao,
        posicaoTexto: sv.posicao || '',
        grupo: sv.grupo || '',
        area: sv.area || ''
      });
    });
  });
  return [...idx.values()].sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
}

// Constrói o índice de serviços que batem com a pesquisa, no mesmo formato
// de buildSupermercadoIndex. Cada linha do ficheiro T_supermercados tem
// sempre um Serviço associado (mesmo sendo uma linha "por supermercado"),
// por isso as caixas mostradas aqui são só as desse serviço em concreto —
// usa-se a lista já agregada por serviço (caixasPorServico), filtrada pelo
// nome do serviço da ficha. A "Posição" já vinha associada à própria linha
// artigo+serviço no ficheiro de origem — por isso usa-se aqui, tal como no
// índice de supermercado, em vez da posição de armazém.
function buildServicoIndex(q) {
  const idx = new Map();
  Object.keys(superMap).forEach(cod => {
    servicosQueBatem(cod, q).forEach(sv => {
      const key = sv.cod + '|' + sv.nome;
      if (!idx.has(key)) idx.set(key, { cod: sv.cod, nome: sv.nome, artigos: [] });
      idx.get(key).artigos.push({
        cod,
        nome: getNome(cod),
        caixas: caixasDoServico(superMap[cod].caixasPorServico || [], sv.nome),
        posicaoTexto: sv.posicao || '',
        area: sv.area || '',
        grupo: sv.grupo || ''
      });
    });
  });
  return [...idx.values()].sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
}

// ── Ordenação do índice (Supermercados / Serviços) ──────
// Aplica-se às tabelas do índice (buildSupermercadoIndex / buildServicoIndex).
// Estado global e partilhado por todas as fichas do índice — ordenar por
// Código, Artigo ou Posição afeta todas ao mesmo tempo. Clicar outra vez no
// mesmo cabeçalho inverte a direção; clicar num cabeçalho diferente muda o
// campo e volta a começar em ascendente.
let indexSortField = 'artigo'; // 'cod' | 'artigo' | 'posicao'
let indexSortDir   = 'asc';    // 'asc' | 'desc'

function compareIndexArtigos(a, b) {
  let va, vb;
  if (indexSortField === 'cod')            { va = a.cod;           vb = b.cod; }
  else if (indexSortField === 'posicao')   { va = a.posicaoTexto;  vb = b.posicaoTexto; }
  else /* 'artigo' */                      { va = a.nome;          vb = b.nome; }
  const cmp = String(va || '').localeCompare(String(vb || ''), 'pt', { numeric: true, sensitivity: 'base' });
  return indexSortDir === 'asc' ? cmp : -cmp;
}

function sortArrowHtml(field) {
  if (indexSortField !== field) return '';
  return indexSortDir === 'asc' ? ' \u25B2' : ' \u25BC';
}

function setIndexSort(field) {
  if (indexSortField === field) {
    indexSortDir = indexSortDir === 'asc' ? 'desc' : 'asc';
  } else {
    indexSortField = field;
    indexSortDir = 'asc';
  }
  doSearch();
}

// Filtro genérico por dimensão (Local ou Área) nas fichas do índice: mostra
// só as linhas da tabela cujo valor da dimensão corresponde ao botão
// clicado ("Todas" remove o filtro dessa dimensão). Se as duas dimensões
// tiverem filtro ativo ao mesmo tempo, uma linha só fica visível se bater
// com AMBAS. Feito por manipulação direta do DOM (sem re-pesquisar) para
// não perder a posição de scroll nem recalcular o índice inteiro só para
// filtrar uma ficha.
function toggleFiltro(btn) {
  const card = btn.closest('.artigo-card');
  const dim  = btn.dataset.dim; // 'grupo' ou 'area'
  card.querySelectorAll(`.filtro-btn[data-dim="${dim}"]`).forEach(b => b.classList.toggle('active', b === btn));
  aplicarFiltros(card);
}

function aplicarFiltros(card) {
  const dims = [...new Set([...card.querySelectorAll('.filtro-btn')].map(b => b.dataset.dim))];
  const ativos = {};
  dims.forEach(dim => {
    const btnAtivo = card.querySelector(`.filtro-btn[data-dim="${dim}"].active`);
    ativos[dim] = btnAtivo ? btnAtivo.dataset.val : '';
  });
  const rows = card.querySelectorAll('table.cx tbody tr');
  let visiveis = 0;
  rows.forEach(tr => {
    const bate = dims.every(dim => !ativos[dim] || tr.dataset[dim] === ativos[dim]);
    tr.style.display = bate ? '' : 'none';
    if (bate) visiveis++;
  });
  const countEl = card.querySelector('.sec-count');
  if (countEl) {
    const total = countEl.dataset.total;
    const algumFiltroAtivo = dims.some(dim => ativos[dim]);
    countEl.textContent = algumFiltroAtivo ? `${visiveis} de ${total} artigo(s)` : `${total} artigo(s)`;
  }
}

// Debounce: espera que a pessoa pare de escrever por 150ms antes de
// pesquisar. Com milhares de linhas, evita recalcular a cada tecla premida
// muito depressa (ex: ao colar texto ou escrever rápido).
let searchTimer = null;
function onSearchInput() {
  clearTimeout(searchTimer);
  selectedIndexKey = null;
  etqSuperKey = null;
  etqArtigosSel = new Set();
  searchTimer = setTimeout(doSearch, 150);
}

// Com poucos caracteres, uma pesquisa em milhares de linhas devolve
// demasiados resultados para ser útil (ex: "m" sozinho pode encontrar quase
// tudo). Por isso só se pesquisa a partir de 2 caracteres.
const MIN_CHARS = 2;

function doSearch() {
  const qRaw = document.getElementById(activeSearchInputId()).value.trim();
  const q = normaliza(qRaw);
  document.getElementById('btn-clear').style.display = qRaw ? 'inline-flex' : 'none';

  if (!q) { document.getElementById('results').style.display = 'none'; return; }

  if (q.length < MIN_CHARS) {
    document.getElementById('results').style.display = 'block';
    document.getElementById('results-header').textContent = `Escreve pelo menos ${MIN_CHARS} caracteres…`;
    document.getElementById('cards-container').innerHTML = '';
    return;
  }

  document.getElementById('results').style.display = 'block';
  const container = document.getElementById('cards-container');

  if (searchMode === 'artigo') {
    const found = garantirIndicePesquisa().cods.filter(cod => matchArtigo(cod, q));

    document.getElementById('results-header').textContent = found.length
      ? found.length + ' resultado(s) encontrado(s)' + (found.length > 30 ? ' — mostrando os primeiros 30' : '')
      : '';

    if (!found.length) {
      container.innerHTML = emptyStateHtml(qRaw, 'artigo');
      return;
    }
    container.innerHTML = found.slice(0, 30).map(renderCard).join('');
    return;
  }

  if (searchMode === 'etiqueta') {
    renderModoEtiqueta(q, qRaw, container);
    return;
  }

  // Modo "Supermercados / Serviços": em vez de despejar logo todas as
  // fichas encontradas, mostra-se um badge por supermercado/serviço
  // encontrado — a pessoa escolhe qual quer ver, e só essa ficha (com o
  // índice de artigos) é desenhada abaixo. Mesma lógica de "clicar para
  // escolher, com estado ativo" já usada nos badges de Área da ficha de
  // Serviço.
  const gruposSuper   = buildSupermercadoIndex(q).map(g => ({ tipo: 'supermercado', dados: g }));
  const gruposServico = buildServicoIndex(q).map(g => ({ tipo: 'servico', dados: g }));
  const grupos = [...gruposSuper, ...gruposServico];

  document.getElementById('results-header').textContent = grupos.length
    ? grupos.length + ' resultado(s) encontrado(s)' + (grupos.length > 30 ? ' — mostrando os primeiros 30' : '')
    : '';

  if (!grupos.length) {
    selectedIndexKey = null;
    container.innerHTML = emptyStateHtml(qRaw, 'supermercado ou serviço');
    return;
  }

  const gruposMostrados = grupos.slice(0, 30);
  const picker = renderIndexPicker(gruposMostrados);

  const escolhido = gruposMostrados.find(g => grupoKey(g) === selectedIndexKey);
  const detalhe = escolhido
    ? renderSuperGroupCard(escolhido.dados, escolhido.tipo)
    : `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <p>Escolhe um supermercado ou serviço acima para ver os artigos.</p>
      </div>`;

  container.innerHTML = picker + detalhe;
}

// Identificador único de um grupo do índice (supermercado ou serviço),
// usado para saber qual badge está escolhido e para o marcar como "active".
function grupoKey(g) {
  return g.tipo + '|' + g.dados.cod + '|' + g.dados.nome;
}

// Ficha com um badge por supermercado/serviço encontrado. Reaproveita a
// mesma classe .area-btn dos botões de filtro por Área, para manter a
// mesma linguagem visual de "escolher uma opção".
function renderIndexPicker(grupos) {
  const porTipo = { supermercado: [], servico: [] };
  grupos.forEach(g => porTipo[g.tipo].push(g));

  const secao = (tipo, label) => {
    const lista = porTipo[tipo];
    if (!lista.length) return '';
    const badges = lista.map(g => {
      const key = grupoKey(g);
      const ativo = key === selectedIndexKey ? ' active' : '';
      return `<button type="button" class="area-btn${ativo}" data-key="${escHtml(key)}" onclick="selectGrupoIndex(this.dataset.key)">${escHtml(g.dados.nome)}</button>`;
    }).join('');
    return `<div class="super-group">
      <div class="super-group-label">${escHtml(label)} (${lista.length})</div>
      <div class="area-filter-row">${badges}</div>
    </div>`;
  };

  return `<div class="artigo-card">
    <div class="artigo-card-body">
      ${secao('supermercado', 'Supermercados')}
      ${secao('servico', 'Serviços')}
    </div>
  </div>`;
}

// Clique num badge do picker: escolhe esse supermercado/serviço e
// redesenha (a pesquisa em si não muda, só a ficha escolhida).
function selectGrupoIndex(key) {
  selectedIndexKey = key;
  doSearch();
}

// ── Modo Etiqueta ───────────────────────────────────────
// Fluxo: (1) escolher supermercado por badge, (2) escolher artigo desse
// supermercado, (3) gerar a etiqueta 23x80mm. Reaproveita
// buildSupermercadoIndex para saber que artigos existem em cada
// supermercado e qual a posição do artigo nesse supermercado.
function renderModoEtiqueta(q, qRaw, container) {
  const grupos = buildSupermercadoIndex(q);

  document.getElementById('results-header').textContent = grupos.length
    ? grupos.length + ' supermercado(s) encontrado(s)' + (grupos.length > 30 ? ' — mostrando os primeiros 30' : '')
    : '';

  if (!grupos.length) {
    etqSuperKey = null; etqArtigosSel = new Set();
    container.innerHTML = emptyStateHtml(qRaw, 'supermercado');
    return;
  }

  const mostrados = grupos.slice(0, 30);
  const superEscolhido = mostrados.find(g => (g.cod + '|' + g.nome) === etqSuperKey);

  // Passo 1: badges de supermercado (mesma linguagem visual do picker do
  // índice — classe .area-btn).
  const badgesSuper = mostrados.map(g => {
    const key = g.cod + '|' + g.nome;
    const ativo = key === etqSuperKey ? ' active' : '';
    return `<button type="button" class="area-btn${ativo}" data-key="${escHtml(key)}" onclick="selectEtqSupermercado(this.dataset.key)">${escHtml(g.nome)}</button>`;
  }).join('');

  // Artigos do supermercado escolhido, pela ordem em que aparecem nos
  // botões — é também a ordem por que saem as etiquetas, para a folha
  // impressa se poder conferir contra o ecrã.
  const artigosOrdenados = superEscolhido
    ? superEscolhido.artigos.slice().sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || ''), 'pt'))
    : [];
  // Só contam os marcados que existem MESMO neste supermercado (ao trocar
  // de supermercado, os que lá não existem ficam de fora sem se perderem).
  const escolhidos = artigosOrdenados.filter(art => etqArtigosSel.has(art.cod));

  let passo2 = '';
  if (superEscolhido) {
    // Passo 2: um botão por artigo desse supermercado (escolha múltipla —
    // cada clique marca/desmarca).
    const botoesArtigo = artigosOrdenados.map(art => {
      const ativo = etqArtigosSel.has(art.cod) ? ' active' : '';
      return `<button type="button" class="area-btn etq-artigo-btn${ativo}" data-cod="${escHtml(art.cod)}" onclick="selectEtqArtigo(this.dataset.cod)" title="Marcar/desmarcar este artigo">${escHtml(art.cod)} — ${escHtml(art.nome || '—')}</button>`;
    }).join('');
    passo2 = `<div class="super-group">
      <div class="super-group-label">Artigos (${artigosOrdenados.length})${escolhidos.length ? ` — ${escolhidos.length} marcado(s)` : ''}</div>
      <div class="area-filter-row">${botoesArtigo}</div>
    </div>`;
  }

  // Passo 3: as etiquetas (uma por artigo marcado). Guarda-se também o que
  // está a ser mostrado, para o botão de imprimir todas não ter de repetir
  // a procura.
  etqEtiquetasAtuais = superEscolhido
    ? { superNome: superEscolhido.nome, artigos: escolhidos }
    : null;
  const etiquetasHtml = escolhidos
    .map(art => renderEtiqueta(art.cod, superEscolhido.nome, art.posicaoTexto || art.posicao || ''))
    .join('');
  // Com duas ou mais etiquetas, o botão que as manda todas para uma folha
  // A4 — cada etiqueta mantém à mesma o seu botão individual (rolo 23x80mm).
  const barraHtml = escolhidos.length > 1
    ? `<div class="etq-lote-bar"><button type="button" class="etq-print-btn" onclick="imprimirEtiquetasEscolhidas()">Imprimir etiquetas (${escolhidos.length})</button></div>`
    : '';

  container.innerHTML = `<div class="artigo-card"><div class="artigo-card-body">
    <div class="super-group">
      <div class="super-group-label">Supermercado (${mostrados.length})</div>
      <div class="area-filter-row">${badgesSuper}</div>
    </div>
    ${passo2}
  </div></div>${barraHtml}${etiquetasHtml}`;
  // As etiquetas no ecrã já têm medidas: encolhe a descrição das que não
  // couberem, para o que se vê ser igual ao que sai impresso.
  ajustarDescricoesEtiquetas(container);
}

function selectEtqSupermercado(key) {
  etqSuperKey = key;
  // Mantém os artigos marcados que ainda existirem neste supermercado (o
  // filtro é feito no render); reselecionar o mesmo supermercado não perde
  // nada.
  doSearch();
}

// Marca/desmarca um artigo: é o que permite gerar várias etiquetas de uma
// vez sem ter de voltar atrás a cada uma.
function selectEtqArtigo(cod) {
  if (etqArtigosSel.has(cod)) etqArtigosSel.delete(cod);
  else etqArtigosSel.add(cod);
  doSearch();
}

// Imprime todas as etiquetas marcadas no modo Etiqueta, seguidas numa folha
// A4 — a mesma impressão em lote do índice de supermercado.
function imprimirEtiquetasEscolhidas() {
  if (!etqEtiquetasAtuais || !etqEtiquetasAtuais.artigos.length) return;
  const html = etqEtiquetasAtuais.artigos
    .map(art => renderEtiqueta(art.cod, etqEtiquetasAtuais.superNome, art.posicaoTexto || art.posicao || ''))
    .join('');
  prepararAreaDeEtiquetas(html, '@media print { @page { size: A4; margin: 10mm; } }', true);
  window.print();
}

// Desenha a etiqueta 23x80mm: 4 colunas lado a lado —
//   [QR] [Posição / código / SGCIM] [Descrição] [Preço médio]
// A cor (branco/amarelo/rosa) pinta só o código e a descrição, por regra
// de negócio (corDaEtiqueta). O QR contém código|posição|supermercado.
function renderEtiqueta(cod, superNome, posicao) {
  const arm = armMap[cod] || { descArtigo: '', posicoes: [], stockavel: '', precoMedio: '' };
  const descZonas = (arm.posicoes || []).map(p => p.descZona);
  const cor = corDaEtiqueta(arm.stockavel, descZonas);
  const preco = formatarPreco(arm.precoMedio);
  const qrDados = dadosQrEtiqueta(cod, posicao, superNome);

  // QR em SVG (crisp na impressão), gerado pela lib embutida (offline).
  let qrSvg = '';
  try {
    const qr = window.qrcode(0, 'M');
    qr.addData(qrDados);
    qr.make();
    qrSvg = qr.createSvgTag({ cellSize: 3, margin: 0, scalable: true });
  } catch (err) {
    qrSvg = '<span class="no-data">QR indisponível</span>';
  }

  return `<div class="etiqueta-wrap">
    <div class="etiqueta cor-${cor}">
      <div class="etq-qr">${qrSvg}</div>
      <div class="etq-meio">
        <div class="etq-pos">${escHtml(posicao || '—')}</div>
        <div class="etq-cod-cell">${escHtml(cod)}</div>
        <div class="etq-sgcim">SGCIM</div>
      </div>
      <div class="etq-descricao"><span class="etq-desc-txt">${escHtml(arm.descArtigo || '—')}</span></div>
      <div class="etq-preco">${escHtml(preco)}</div>
    </div>
    <button type="button" class="etq-print-btn" onclick="imprimirEtiqueta(this)">Imprimir etiqueta</button>
  </div>`;
}

// A descrição usa TODO o espaço da sua coluna (22.9x23mm): a letra é
// procurada nos dois sentidos — cresce nos nomes curtos e encolhe nos
// compridos — ficando com o maior tamanho que ainda cabe inteiro.
//
// Antes o tamanho era fixo em 10px e só encolhia (v1.33.0): os nomes curtos
// ficavam pequenos com a célula meia vazia, que é o que se via nas etiquetas
// impressas.
//
// Limites: DESC_MIN é o mínimo que ainda se lê impresso (abaixo disso o
// texto voltaria a ser cortado, como antes); DESC_MAX evita que uma
// descrição de uma palavra fique com um corpo desproporcionado ao resto da
// etiqueta. A procura é binária em passos de 0.25px — ~7 medições por
// etiqueta em vez das ~90 de um varrimento, o que conta quando se imprime
// um lote grande numa folha A4.
//
// Só funciona com o elemento visível/mensurável: numa área com display:none
// as medidas vêm a zero e a função sai sem mexer em nada. É por isso que a
// área de impressão é medida com o truque do "fora do ecrã" (ver
// prepararAreaDeEtiquetas).
const DESC_MIN = 5.5;
const DESC_MAX = 20;
const DESC_PASSO = 0.25;
// Abaixo deste tamanho já não vale a pena manter palavras inteiras (ver
// ajustarDescricaoEtiqueta). É o tamanho que a descrição tinha fixo antes.
const DESC_BASE = 10;

function ajustarDescricaoEtiqueta(cell) {
  const txt = cell.querySelector('.etq-desc-txt');
  if (!txt) return;
  const cs = window.getComputedStyle(cell);
  const alturaUtil = cell.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const larguraUtil = cell.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  if (!(alturaUtil > 0) || !(larguraUtil > 0)) return;

  // +0.5px de tolerância: evita rejeitar um tamanho por causa de
  // arredondamentos de sub-pixel quando o texto cabe mesmo à justa.
  const cabe = (px) => {
    txt.style.fontSize = px + 'px';
    return txt.scrollHeight <= alturaUtil + 0.5 && txt.scrollWidth <= larguraUtil + 0.5;
  };

  // Maior tamanho que ainda cabe, por procura binária. Devolve null quando
  // nem no mínimo cabe.
  const procurar = () => {
    if (!cabe(DESC_MIN)) return null;
    let cabeSempre = DESC_MIN;
    let jaNaoCabe = DESC_MAX + DESC_PASSO;
    while (jaNaoCabe - cabeSempre > DESC_PASSO) {
      const meio = Math.round(((cabeSempre + jaNaoCabe) / 2) / DESC_PASSO) * DESC_PASSO;
      if (cabe(meio)) cabeSempre = meio;
      else jaNaoCabe = meio;
    }
    return cabeSempre;
  };

  // Primeira tentativa com as palavras inteiras: se uma palavra não couber
  // na linha, transborda em largura, o tamanho é rejeitado e a letra desce.
  txt.style.overflowWrap = 'normal';
  const inteiras = procurar();

  // Palavras inteiras é o que se lê melhor, mas não à custa de letra
  // minúscula com meia célula vazia (era o caso de "ACIDO ACETILSALICILICO
  // -> IMV FRAMP 500 MG": a palavra comprida obrigava a 8.5px e sobrava
  // um terço da altura). Por isso: enquanto as palavras inteiras derem pelo
  // menos DESC_BASE, ficam inteiras; abaixo disso vale mais partir a palavra
  // e usar o espaço todo.
  let tamanho = inteiras;
  if (inteiras === null || inteiras < DESC_BASE) {
    txt.style.overflowWrap = 'anywhere';
    const partidas = procurar();
    if (partidas !== null && (inteiras === null || partidas > inteiras)) {
      tamanho = partidas;
    } else {
      txt.style.overflowWrap = 'normal';
    }
  }
  cabe(tamanho === null ? DESC_MIN : tamanho);
}

// Ajusta todas as descrições dentro de um elemento (ecrã ou área de
// impressão).
function ajustarDescricoesEtiquetas(root) {
  if (!root) return;
  root.querySelectorAll('.etq-descricao').forEach(ajustarDescricaoEtiqueta);
}

// Impressão: as etiquetas são clonadas para uma área própria
// (#etq-print-area, filho direto do body) e o body fica com a classe
// .print-etq — o CSS @media print esconde tudo o resto com display:none,
// para sair só a(s) etiqueta(s) sem cabeçalhos, barras da app nem páginas
// em branco atrás.
//
// NADA é mexido no documento enquanto a impressão decorre — é essa a regra
// que custou três versões a acertar:
//   v1.28.2: a área era removida por um temporizador de 1s. No Chrome do
//     Android o window.print() não bloqueia (devolve logo e a
//     pré-visualização é montada a seguir), por isso o temporizador disparava
//     a meio e saía a app inteira em folhas de 23mm — dezenas de páginas.
//   v1.28.3: passou a remover-se no afterprint / na media query 'print' /
//     no regresso do foco. No telemóvel esses eventos também chegam CEDO
//     DEMAIS (a janela recebe focus quando a pré-visualização abre, e a media
//     query 'print' já está falsa nessa altura), e a página era limpa com a
//     pré-visualização aberta: a etiqueta na primeira folha e uma segunda
//     folha em branco, do documento já vazio. No PC, onde o print() bloqueia,
//     isto nunca acontecia — daí "no PC uma página, no telemóvel duas".
// Agora esses eventos só MARCAM o estado como usado; a área é substituída na
// impressão seguinte. Ficar no documento não custa nada: #etq-print-area é
// display:none no ecrã e as classes .print-etq/.print-lote só têm efeito
// dentro de @media print.
let etqPrintEstado = null;

// Remove a área da impressão anterior. Só é chamada ANTES de uma impressão
// nova (nunca durante uma).
function limparAreaDeEtiquetas() {
  if (!etqPrintEstado) return;
  const { area, style, aoTerminar } = etqPrintEstado;
  etqPrintEstado = null;
  area.remove();
  if (style) style.remove();
  document.body.classList.remove('print-etq', 'print-lote');
  window.removeEventListener('afterprint', aoTerminar);
  window.removeEventListener('focus', aoTerminar);
  const mql = window.matchMedia && window.matchMedia('print');
  if (mql && mql.removeEventListener) mql.removeEventListener('change', aoTerminar);
}

// Monta a área de impressão. pageCss é a regra @page opcional (o lote usa
// A4; uma etiqueta usa o rolo 23x80mm que já vem do CSS base).
function prepararAreaDeEtiquetas(html, pageCss, lote) {
  limparAreaDeEtiquetas();
  const area = document.createElement('div');
  area.id = 'etq-print-area';
  area.innerHTML = html;
  document.body.appendChild(area);
  // A área é display:none no ecrã, e aí nada tem medidas — para ajustar as
  // descrições que não cabem, mostra-se fora do ecrã só o tempo de medir e
  // repõem-se os estilos a seguir. Isto acontece SEMPRE antes do print()
  // (nunca durante uma impressão), por isso não mexe com a regra de não
  // tocar no documento enquanto a impressão decorre.
  area.style.cssText = 'display:block;position:absolute;left:-10000px;top:0;';
  ajustarDescricoesEtiquetas(area);
  area.style.cssText = '';
  document.body.classList.add('print-etq');
  if (lote) document.body.classList.add('print-lote');
  let style = null;
  if (pageCss) {
    style = document.createElement('style');
    style.id = 'etq-print-page';
    style.textContent = pageCss;
    document.head.appendChild(style);
  }
  // Fim da impressão: NÃO se mexe no documento (ver o comentário grande em
  // cima). Marca-se só o estado como usado, para a impressão seguinte pelo
  // menu do browser voltar a ler o que está no ecrã em vez de repetir esta.
  const aoTerminar = () => {
    if (etqPrintEstado) etqPrintEstado.usado = true;
  };
  etqPrintEstado = { area, style, aoTerminar, usado: false };
  window.addEventListener('afterprint', aoTerminar);
  window.addEventListener('focus', aoTerminar);
  const mql = window.matchMedia && window.matchMedia('print');
  if (mql && mql.addEventListener) mql.addEventListener('change', aoTerminar);
}

// Uma etiqueta (modo Etiqueta): imprime a etiqueta do botão carregado.
function imprimirEtiqueta(btn) {
  const wrap = btn && btn.closest ? btn.closest('.etiqueta-wrap') : null;
  const etq = (wrap || document).querySelector('.etiqueta');
  if (!etq) return;
  prepararAreaDeEtiquetas(etq.outerHTML, '', false);
  window.print();
}

// Impressão pedida pelo próprio browser (Ctrl+P, menu "Imprimir" do
// telemóvel, "Partilhar → Imprimir"): não passou pelos botões da app, por
// isso não há área nenhuma preparada e sairia a app inteira em folhas de
// 23mm. Se houver etiquetas no ecrã, prepara a área na mesma — assim o
// resultado é igual ao dos botões. A área da impressão ANTERIOR (já usada)
// é refeita, porque entretanto a escolha de artigos pode ter mudado.
window.addEventListener('beforeprint', () => {
  if (etqPrintEstado && !etqPrintEstado.usado) return;
  const etqs = Array.from(document.querySelectorAll('.etiqueta-wrap .etiqueta'));
  if (!etqs.length) return;
  const html = etqs.map(e => e.outerHTML).join('');
  // Com mais do que uma etiqueta no ecrã vale a mesma regra do botão
  // "Imprimir etiquetas (N)": folha A4 em vez do rolo de 23mm.
  const lote = etqs.length > 1;
  prepararAreaDeEtiquetas(html, lote ? '@media print { @page { size: A4; margin: 10mm; } }' : '', lote);
});

// ── Etiquetas em lote (índice de supermercado) ──────────
// Estado da seleção: códigos marcados via checkbox na ficha de
// supermercado, limpos automaticamente quando se muda de supermercado.
let etqLoteSel = new Set();
let etqLoteEntryAtual = null;
let etqLoteKeyAtual = null;

// Marca/desmarca um artigo e atualiza o contador do botão sem redesenhar
// a ficha toda (para não perder scroll nem filtros).
function toggleEtqLote(cb) {
  if (cb.checked) etqLoteSel.add(cb.dataset.cod);
  else etqLoteSel.delete(cb.dataset.cod);
  const bar = document.getElementById('etq-lote-bar');
  if (bar) bar.style.display = etqLoteSel.size ? 'flex' : 'none';
  const c = document.getElementById('etq-lote-count');
  if (c) c.textContent = etqLoteSel.size;
}

// Gera o HTML do lote: reutiliza renderEtiqueta (mesmo QR, cor e posição
// do par supermercado+artigo) uma vez por código selecionado.
function renderEtiquetaLote(entry, cods) {
  const parts = cods.map(cod => {
    const art = entry.artigos.find(a => a.cod === cod);
    if (!art) return '';
    return renderEtiqueta(art.cod, entry.nome, art.posicaoTexto || art.posicao || '');
  }).join('');
  return parts;
}

// Impressão em lote: monta a área com as etiquetas + regra @page A4
// temporária e imprime — assim a impressão de UMA etiqueta continua a sair
// em rolo 23x80mm como antes. A limpeza é a mesma de uma etiqueta só (ver
// prepararAreaDeEtiquetas).
function imprimirEtiquetasLote() {
  if (!etqLoteEntryAtual || !etqLoteSel.size) return;
  // Sai pela MESMA ordem em que os artigos aparecem na tabela (a ordenação
  // escolhida nos cabeçalhos), não pela ordem em que as checkboxes foram
  // marcadas — assim a folha impressa pode ser conferida linha a linha
  // contra o ecrã.
  const cods = etqLoteEntryAtual.artigos
    .filter(a => etqLoteSel.has(a.cod))
    .sort(compareIndexArtigos)
    .map(a => a.cod);
  const html = renderEtiquetaLote(etqLoteEntryAtual, cods);
  if (!html) return;
  prepararAreaDeEtiquetas(html, '@media print { @page { size: A4; margin: 10mm; } }', true);
  window.print();
}

// Faz scroll até à zona de resultados — usado pelos dois saltos recíprocos
// (badge de supermercado → índice; código de artigo no índice → ficha),
// para a pessoa ver logo o resultado sem ter de procurar no ecrã.
function scrollParaResultados() {
  const resultsEl = document.getElementById('results');
  if (resultsEl.scrollIntoView) resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Clique num badge de supermercado dentro da ficha de artigo (modo
// "Artigos", secção "Supermercados"): salta diretamente para o modo
// "Supermercados / Serviços", preenche a pesquisa com o nome desse
// supermercado e já mostra a sua ficha de índice escolhida — sem a pessoa
// ter de escrever nada nem voltar a clicar no badge do picker. Reaproveita
// o mesmo fluxo de setSearchMode + doSearch + selectedIndexKey já usados
// pela pesquisa normal de "Supermercados / Serviços".
function irParaSupermercadoNoIndice(cod, nome) {
  document.getElementById('search-input-super').value = nome;
  aplicarModoUI('super');

  selectedIndexKey = 'supermercado|' + cod + '|' + nome;
  doSearch();

  scrollParaResultados();
}

// Clique no código de um artigo dentro da tabela do índice (modo
// "Supermercados / Serviços"): salta diretamente para o modo "Artigos",
// preenche a pesquisa com o código desse artigo e já mostra a sua ficha —
// mesma lógica de irParaSupermercadoNoIndice, mas no sentido inverso.
function irParaArtigoNoIndice(cod) {
  document.getElementById('search-input-artigo').value = cod;
  aplicarModoUI('artigo');

  doSearch();

  scrollParaResultados();
}

// Mensagem de "sem resultados", reutilizada pelos dois modos de pesquisa.
function emptyStateHtml(qRaw, tipoLabel) {
  return `<div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    <p>Nenhum ${escHtml(tipoLabel)} encontrado para "<strong>${escHtml(qRaw)}</strong>"</p>
  </div>`;
}

function clearSearch() {
  clearTimeout(searchTimer);
  // Limpa a mesma coisa que onSearchInput limpa a cada tecla: a seleção do
  // índice E a do modo Etiqueta. Sem limpar a da Etiqueta, o supermercado
  // e o artigo escolhidos sobreviviam ao "x" e voltavam a aparecer
  // escolhidos assim que se escrevesse outra pesquisa qualquer.
  selectedIndexKey = null;
  etqSuperKey = null;
  etqArtigosSel = new Set();
  const inp = document.getElementById(activeSearchInputId());
  inp.value = '';
  document.getElementById('btn-clear').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  inp.focus();
}

// ── Scan ao vivo (OCR) ───────────────────────────────────
// Lê o código de artigo apontando a câmara diretamente à etiqueta, em vez
// de tirar uma única foto. Mostra o candidato encontrado e só preenche a
// caixa de pesquisa quando a pessoa confirma — nunca pesquisa sozinho.
//
// Três melhorias de precisão em relação à primeira versão:
// (A) motor de OCR configurado para só reconhecer dígitos, em modo "linha
//     única", e criado uma única vez (não a cada tentativa);
// (B) cada tentativa recorta só a zona da moldura tracejada, amplia-a e
//     converte-a a preto e branco antes de enviar para o OCR;
// (C) um candidato só é mostrado como "encontrado" depois de a MESMA
//     leitura sair 2 vezes seguidas.

// Letras que o OCR troca frequentemente por dígitos parecidos, aplicado
// antes de descartar tudo o que não é dígito. Testado em
// ocr-helpers.test.mjs.
const OCR_CONFUSOES = { O: '0', o: '0', I: '1', l: '1', S: '5', s: '5', B: '8' };

function extrairDigitos(textoOcr) {
  const corrigido = String(textoOcr || '').replace(/[OoIlSsB]/g, c => OCR_CONFUSOES[c]);
  return corrigido.replace(/\D/g, '');
}

// Só aceita um candidato com dígitos suficientes (por omissão, 4), para
// não mostrar "ruído" de 1 número solto lido por engano. Usado tal e qual
// para o código de BARRAS, em que o ZXing devolve um número só.
function digitosValidos(textoOcr, minDigitos = 4) {
  const digitos = extrairDigitos(textoOcr);
  return digitos.length >= minDigitos ? digitos : '';
}

// Escolhe o código de artigo de entre as linhas que o OCR leu na faixa.
//
// A etiqueta é uma lista de campos, todos do MESMO tamanho de letra:
//
//   Servico:      11I
//   Tag:          B1240001940
//   Produto:      1260500100     ← é este o código que se procura
//   Localizacao:  P.04.00
//
// Duas tentativas anteriores falharam aqui, e por razões que só a etiqueta
// verdadeira mostrou:
//
//   - juntar os dígitos do texto todo dava um número inventado, colando os
//     três campos num só (v1.35.0 e anteriores);
//   - escolher a linha de letra maior não decide nada, porque os campos
//     têm todos o mesmo tamanho — 122, 126 e 116 pixéis na leitura real.
//     A regra recusava-se a escolher e o scan ficava sem candidato
//     (v1.36.0 e v1.37.0).
//
// O que distingue mesmo o código é o campo a que pertence e o facto de ser
// uma sequência de exactamente 10 dígitos. Daí:
//
//   1. havendo o campo "Produto" na imagem, olha-se só para a faixa
//      horizontal dele — o valor está à mesma altura do nome do campo,
//      quer venha na mesma linha, quer venha separado (o SPARSE_TEXT
//      separa-os quando há um vão grande entre os dois);
//   2. não havendo, procura-se em todas as linhas.
//
// Em qualquer dos casos só se aceita um candidato de 10 dígitos, e só se
// ele for único. Havendo dois, não se escolhe nada e tenta-se no ciclo
// seguinte — mais vale não mostrar nada do que mostrar o número errado.
const CODIGO_DIGITOS = 10;
const CAMPO_CODIGO = /pr[o0]du/i; // "Produto", tolerando o o→0 do OCR

// Candidatos numa linha. Duas leituras de propósito, porque o OCR tanto
// devolve "Produto: 1260500100" junto como o valor sozinho:
//   (a) a linha inteira, se der exactamente 10 dígitos;
//   (b) qualquer PALAVRA que seja toda dígitos e tenha 10.
// A (b) é indispensável quando o nome do campo vem colado ao valor: a
// correcção de confusões transforma os "o" de "Produto" em zeros, e a
// linha inteira passaria a dar 12 dígitos em vez de 10.
function candidatosDaLinha(texto) {
  const candidatos = new Set();
  const linhaToda = extrairDigitos(texto);
  if (linhaToda.length === CODIGO_DIGITOS) candidatos.add(linhaToda);
  for (const palavra of String(texto || '').split(/[^0-9A-Za-z]+/)) {
    const digitos = extrairDigitos(palavra);
    if (digitos.length === palavra.length && digitos.length === CODIGO_DIGITOS) {
      candidatos.add(digitos);
    }
  }
  return [...candidatos];
}

function centroVertical(linha) {
  return (linha.bbox.y0 + linha.bbox.y1) / 2;
}

function linhasDoCampoCodigo(linhas) {
  const campo = linhas.find(l => CAMPO_CODIGO.test(l.text || ''));
  if (!campo) return null;
  const centro = centroVertical(campo);
  const tolerancia = Math.max(campo.bbox.y1 - campo.bbox.y0, 1) * 0.8;
  return linhas.filter(l => Math.abs(centroVertical(l) - centro) <= tolerancia);
}

function escolherCodigoDasLinhas(linhas) {
  const comCaixa = (linhas || []).filter(l => l && l.bbox);
  const alvo = linhasDoCampoCodigo(comCaixa) || comCaixa;
  const candidatos = [...new Set(alvo.flatMap(l => candidatosDaLinha(l.text)))];
  return candidatos.length === 1 ? candidatos[0] : '';
}

// ── Diagnóstico do OCR ──────────────────────────────────
// Estas duas funções não decidem nada: só põem em palavras o que o
// escolherCodigoDasLinhas acabou de fazer, para o modo de diagnóstico
// mostrar no ecrã. Existem porque as duas avarias do OCR (v1.35.0 e
// v1.36.0) foram diagnosticadas às cegas, a partir de etiquetas
// inventadas — e a segunda só apareceu porque as inventadas tinham uma
// linha e as verdadeiras têm três. Com isto, quem tem a etiqueta na mão vê
// o que o motor viu.

// Cada linha lida, com o que dela se aproveita.
function resumirLinhasOcr(data) {
  return ((data && data.lines) || []).map(linha => ({
    texto: String((linha && linha.text) || '').trim(),
    digitos: extrairDigitos(linha && linha.text),
    altura: linha && linha.bbox ? Math.round(linha.bbox.y1 - linha.bbox.y0) : 0,
  }));
}

// Porque é que saiu (ou não saiu) um candidato desta leitura.
function explicarEscolhaOcr(data) {
  const comCaixa = ((data && data.lines) || []).filter(l => l && l.bbox);
  if (!comCaixa.length) {
    const soTexto = digitosValidos(data && data.text);
    return {
      escolhido: soTexto,
      motivo: soTexto
        ? 'sem linhas do motor — usado o texto corrido (reserva)'
        : 'o motor não devolveu linhas nenhumas nesta imagem',
    };
  }

  const doCampo = linhasDoCampoCodigo(comCaixa);
  const alvo = doCampo || comCaixa;
  const onde = doCampo
    ? `na faixa do campo "Produto" (${doCampo.length} linha(s))`
    : 'em todas as linhas (campo "Produto" não encontrado)';
  const candidatos = [...new Set(alvo.flatMap(l => candidatosDaLinha(l.text)))];

  if (candidatos.length === 1) {
    return { escolhido: candidatos[0], motivo: `único número de ${CODIGO_DIGITOS} dígitos ${onde}` };
  }
  if (candidatos.length > 1) {
    return {
      escolhido: '',
      motivo: `ambíguo: ${candidatos.length} números de ${CODIGO_DIGITOS} dígitos ${onde} — ${candidatos.join(', ')}`,
    };
  }
  return { escolhido: '', motivo: `nenhum número de ${CODIGO_DIGITOS} dígitos ${onde}` };
}

// (B) Calcula, em pixels do vídeo original, o retângulo que corresponde à
// moldura tracejada mostrada por cima do vídeo — tem de imitar o
// "object-fit: cover" do CSS (o vídeo é primeiro cortado ao meio para
// caber no rácio do .scan-video-wrap, e só depois se aplica a % da
// moldura). Testado em ocr-helpers.test.mjs.
const SCAN_WRAP_ASPECT = 3 / 4; // igual ao aspect-ratio do .scan-video-wrap no CSS
const SCAN_FRAME_INSET = { top: 0.40, bottom: 0.40, left: 0.08, right: 0.08 }; // igual ao .scan-frame-hint

function calcularRetanguloRecorte(videoWidth, videoHeight, wrapAspect, inset) {
  const videoAspect = videoWidth / videoHeight;
  let coverWidth, coverHeight, offsetX, offsetY;
  if (videoAspect > wrapAspect) {
    coverHeight = videoHeight;
    coverWidth = videoHeight * wrapAspect;
    offsetX = (videoWidth - coverWidth) / 2;
    offsetY = 0;
  } else {
    coverWidth = videoWidth;
    coverHeight = videoWidth / wrapAspect;
    offsetX = 0;
    offsetY = (videoHeight - coverHeight) / 2;
  }
  return {
    x: Math.round(offsetX + coverWidth * inset.left),
    y: Math.round(offsetY + coverHeight * inset.top),
    width: Math.round(coverWidth * (1 - inset.left - inset.right)),
    height: Math.round(coverHeight * (1 - inset.top - inset.bottom)),
  };
}

// Escolhe sozinho o ponto de corte entre "preto" e "branco" (método de
// Otsu: o limiar que melhor separa a imagem em dois grupos de brilho).
// Até à v1.27.1 o limiar era fixo em 150, o que só funciona com a
// etiqueta bem iluminada: à luz do armazém, uma etiqueta na sombra ficava
// toda preta e uma debaixo do foco ficava toda branca — em qualquer dos
// casos o OCR recebia uma imagem sem nada para ler e nunca devolvia
// número nenhum. Testado em ocr-helpers.test.mjs.
function calcularLimiarOtsu(data) {
  const histograma = new Array(256).fill(0);
  let totalPixeis = 0;
  for (let i = 0; i < data.length; i += 4) {
    const cinza = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
    histograma[cinza]++;
    totalPixeis++;
  }
  if (!totalPixeis) return 128;
  let somaTotal = 0;
  for (let nivel = 0; nivel < 256; nivel++) somaTotal += nivel * histograma[nivel];
  let somaFundo = 0, pesoFundo = 0, melhorVariancia = -1;
  // Todos os níveis SEM PIXÉIS entre as duas modas dão exatamente a mesma
  // variância, formando um "planalto" de empates. Ficar pelo primeiro
  // empate encosta o limiar à moda escura e volta a pôr quase tudo branco
  // — era o que acontecia antes de se guardar o intervalo todo e cortar a
  // meio dele.
  let primeiroMelhor = 128, ultimoMelhor = 128;
  for (let nivel = 0; nivel < 256; nivel++) {
    pesoFundo += histograma[nivel];
    if (!pesoFundo) continue;
    const pesoFrente = totalPixeis - pesoFundo;
    if (!pesoFrente) break;
    somaFundo += nivel * histograma[nivel];
    const mediaFundo = somaFundo / pesoFundo;
    const mediaFrente = (somaTotal - somaFundo) / pesoFrente;
    const variancia = pesoFundo * pesoFrente * (mediaFundo - mediaFrente) ** 2;
    if (variancia > melhorVariancia) {
      melhorVariancia = variancia;
      primeiroMelhor = ultimoMelhor = nivel;
    } else if (variancia === melhorVariancia) {
      ultimoMelhor = nivel;
    }
  }
  // +1 porque quem usa este valor (aplicarLimiarPB) compara com ">=": o
  // nível devolvido por Otsu é o ÚLTIMO do fundo, logo o primeiro nível
  // branco é o seguinte.
  return Math.min(255, Math.round((primeiroMelhor + ultimoMelhor) / 2) + 1);
}

// (B) Converte a preto e branco "puro" (threshold), para ajudar o OCR a
// distinguir melhor os traços do número do fundo da etiqueta. Sem limiar
// explícito, calcula-o a partir da própria imagem (ver calcularLimiarOtsu).
// Testado em ocr-helpers.test.mjs.
function aplicarLimiarPB(data, limiar = calcularLimiarOtsu(data)) {
  for (let i = 0; i < data.length; i += 4) {
    const cinza = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    const valor = cinza >= limiar ? 255 : 0;
    data[i] = valor;
    data[i + 1] = valor;
    data[i + 2] = valor;
  }
  return data;
}

// Quanto se amplia a zona recortada antes do OCR — texto pequeno lê pior;
// ampliar ajuda o motor a distinguir melhor os traços de cada dígito.
const SCAN_AMPLIACAO = 2;

// (C) Só confirma um candidato depois de a mesma leitura aparecer 2 vezes
// seguidas — reduz o risco de mostrar um número errado por uma leitura
// pontual mal feita. Testado em ocr-helpers.test.mjs.
function processarLeituraConsecutiva(estadoAnterior, novaLeitura) {
  if (!novaLeitura) return { ultima: '', count: 0, confirmado: false };
  if (novaLeitura === estadoAnterior.ultima) {
    const count = estadoAnterior.count + 1;
    return { ultima: novaLeitura, count, confirmado: count >= 2 };
  }
  return { ultima: novaLeitura, count: 1, confirmado: false };
}

function showOcrMsg(texto) {
  const el = document.getElementById('ocr-msg');
  el.textContent = texto;
  el.style.display = 'block';
}

function hideOcrMsg() {
  document.getElementById('ocr-msg').style.display = 'none';
}

// Estado do scan ao vivo: a stream da câmara, o "worker" do Tesseract
// (criado uma única vez por sessão de scan — ver abrirScanAoVivo), se o
// ciclo de leitura está ativo, e o estado de confirmação por 2 leituras
// seguidas (ver processarLeituraConsecutiva).
let scanStream = null;
let scanWorker = null;
let scanBarcodeReader = null;
let scanLoopAtivo = false;
let scanCandidatoAtual = '';
let scanEstadoLeitura = { ultima: '', count: 0 };
let scanEstadoCodigoBarras = { ultima: '', count: 0 };

// Tempo de espera entre tentativas de OCR. Isto é A PARTIR do fim da
// tentativa anterior (nunca em paralelo), para não sobrecarregar o
// aparelho com pedidos de OCR acumulados.
const SCAN_INTERVALO_MS = 1500;

// Tempo de espera entre tentativas de código de barras. É MUITO mais
// curto do que o do OCR de propósito: ler um código de barras num
// fotograma custa poucos milissegundos (o OCR custa centenas), e o que
// decide se a leitura resulta é apanhar o instante em que a câmara está
// focada e direita. Até à v1.27.1 as duas vias partilhavam o mesmo ciclo
// de 1,5 s E o código de barras só era tentado DEPOIS de o OCR anterior
// terminar — na prática dava-se ao código de barras uma oportunidade a
// cada 2-4 segundos, e quase nunca calhava num fotograma nítido.
const SCAN_BARCODE_INTERVALO_MS = 120;

// Formatos que interessam mesmo: as etiquetas usam Code 39, e os artigos
// embalados trazem EAN/UPC. Restringir a lista (em vez de deixar o ZXing
// tentar todos os formatos que conhece, incluindo os 2D) torna cada
// tentativa mais rápida e reduz leituras erradas. TRY_HARDER autoriza o
// ZXing a gastar mais esforço por fotograma — compensa, porque agora há
// muitas mais tentativas por segundo.
function criarLeitorCodigoBarras() {
  const LeitorZXing = ZXingBrowser.BrowserMultiFormatReader;
  try {
    const { BarcodeFormat, DecodeHintType } = ZXingBrowser;
    if (!BarcodeFormat || !DecodeHintType) return new LeitorZXing();
    const hints = new Map();
    hints.set(DecodeHintType.POSSIBLE_FORMATS, [
      BarcodeFormat.CODE_39, BarcodeFormat.CODE_128, BarcodeFormat.ITF,
      BarcodeFormat.EAN_13, BarcodeFormat.EAN_8, BarcodeFormat.UPC_A,
    ]);
    hints.set(DecodeHintType.TRY_HARDER, true);
    return new LeitorZXing(hints);
  } catch (err) {
    // Uma versão do ZXing que não exponha estes símbolos não deve deixar
    // o scan sem leitor nenhum — vale mais um leitor sem afinação.
    return new LeitorZXing();
  }
}

// Pede à câmara a maior resolução que ela conseguir dar. Os dígitos da
// etiqueta ocupam poucos pixels; com os 640x480 que muitos telemóveis dão
// por omissão, depois de recortar a faixa da moldura sobra texto
// irreconhecível. facingMode vai como "ideal" (não exato) de propósito:
// num aparelho sem câmara traseira identificada, "exact" faz o
// getUserMedia falhar por inteiro e o scan nem abria.
const SCAN_CAMERA_CONSTRAINTS = {
  video: {
    facingMode: { ideal: 'environment' },
    width: { ideal: 1920 },
    height: { ideal: 1080 },
  },
};

// Liga o foco automático contínuo quando o aparelho o suporta. Sem isto,
// muitas câmaras fixam o foco no primeiro plano e a etiqueta fica sempre
// desfocada — nem o código de barras nem o OCR conseguem ler uma imagem
// desfocada, por muitas tentativas que se façam.
async function tentarFocoContinuo(stream) {
  try {
    const track = stream.getVideoTracks()[0];
    if (!track || typeof track.getCapabilities !== 'function') return;
    const caps = track.getCapabilities();
    if (caps.focusMode && caps.focusMode.includes('continuous')) {
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    }
  } catch (err) {
    // Aparelho/browser que não deixa mexer no foco — segue com o foco dele.
  }
}

async function abrirScanAoVivo() {
  hideOcrMsg();

  // As duas bibliotecas vêm de CDN e podem faltar (rede da instituição a
  // bloquear o domínio, primeira visita sem internet). Sem esta
  // verificação, o `new ZXingBrowser...` rebentava com ReferenceError a
  // meio da função e deixava o overlay aberto com a câmara ligada e sem
  // mensagem nenhuma — exatamente o sintoma de "abre mas não lê nada".
  const temZXing = typeof ZXingBrowser !== 'undefined';
  const temTesseract = typeof Tesseract !== 'undefined';
  if (!temZXing && !temTesseract) {
    showOcrMsg('As bibliotecas de leitura não foram carregadas. Liga-te à internet uma vez para as descarregar e tenta outra vez.');
    return;
  }

  const overlay = document.getElementById('scan-overlay');
  document.getElementById('scan-candidate').style.display = 'none';
  scanCandidatoAtual = '';
  scanEstadoLeitura = { ultima: '', count: 0 };
  scanEstadoCodigoBarras = { ultima: '', count: 0 };
  document.getElementById('scan-status').textContent = 'A abrir câmara…';
  overlay.classList.add('open');

  try {
    scanStream = await navigator.mediaDevices.getUserMedia(SCAN_CAMERA_CONSTRAINTS);
  } catch (err) {
    // Segunda tentativa sem exigências de resolução: há câmaras (webcams
    // antigas, alguns tablets) que recusam 1920x1080 e só aceitam o pedido
    // mínimo. Vale mais abrir em baixa resolução do que não abrir.
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video: true });
    } catch (err2) {
      overlay.classList.remove('open');
      showOcrMsg('Não foi possível aceder à câmara. Verifica as permissões do browser e tenta novamente.');
      return;
    }
  }

  await tentarFocoContinuo(scanStream);

  const video = document.getElementById('scan-video');
  video.srcObject = scanStream;
  try { await video.play(); } catch (err) { /* alguns browsers já dão play automático */ }

  // Leitor de código de barras (ZXing) — as etiquetas têm um código de
  // barras Code 39 por baixo do texto, bem mais fiável de ler do que o
  // texto por OCR. Criado ANTES do motor de OCR de propósito: o ZXing já
  // está todo carregado nesta altura, enquanto o Tesseract ainda tem de ir
  // buscar vários MB à rede — e uma falha nessa descarga não pode levar
  // atrás a leitura de códigos de barras (ver abaixo).
  if (temZXing) scanBarcodeReader = criarLeitorCodigoBarras();

  // (A) Cria o motor de OCR uma única vez por sessão de scan (não a cada
  // fotograma — recriá-lo seria bem mais lento), já configurado para só
  // reconhecer dígitos.
  //
  // SPARSE_TEXT e não SINGLE_LINE: o SINGLE_LINE promete ao motor que a
  // imagem tem UMA linha de texto e mais nada. A faixa recortada quase
  // nunca é assim — apanha o fim da descrição em cima e a posição em baixo
  // — e nesse caso o SINGLE_LINE devolve lixo ou, com duas linhas
  // vizinhas, não devolve nada de todo. Era esta a razão de o OCR não ler
  // etiquetas reais mesmo depois de corrigido o limiar na v1.35.0. O
  // SPARSE_TEXT procura texto onde ele estiver e devolve as linhas
  // separadas, que é o que o escolherCodigoDasLinhas precisa.
  if (temTesseract) {
    document.getElementById('scan-status').textContent = 'A preparar leitura…';
    try {
      scanWorker = await Tesseract.createWorker('eng');
      await scanWorker.setParameters({
        // SEM lista branca de caracteres. Parece contra-intuitivo — a
        // etiqueta só tem números que interessem — mas a lista de dígitos
        // fazia mal por duas vias, ambas medidas sobre a etiqueta real:
        //
        //   1. apagava os nomes dos campos ("Tag:", "Produto:"), que são
        //      justamente o que diz QUAL dos números é o código;
        //   2. apagava as letras dentro dos valores. O "B" de
        //      "B1240001940" desaparecia e o Tag ficava com 10 dígitos —
        //      o mesmo comprimento do código do produto, impossível de
        //      distinguir. Com as letras activadas o B sobrevive, o Tag
        //      fica com 11 e deixa de haver confusão.
        tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT,
      });
    } catch (err) {
      // O Tesseract descarrega o motor e os dados de idioma de OUTROS
      // domínios em runtime, que podem estar bloqueados mesmo com a app a
      // funcionar. Até à v1.27.1 isto fechava a câmara e acabava o scan —
      // ou seja, uma CDN bloqueada tirava também o código de barras, que
      // nem precisa de rede nenhuma. Agora só se perde o OCR.
      scanWorker = null;
    }
  }

  if (!scanBarcodeReader && !scanWorker) {
    fecharScanAoVivo();
    showOcrMsg('Não foi possível preparar o motor de leitura. Tenta novamente.');
    return;
  }

  document.getElementById('scan-status').textContent = scanWorker
    ? 'A tentar ler o código…'
    : 'A tentar ler o código de barras… (leitura de texto indisponível)';

  scanLoopAtivo = true;
  // Dois ciclos independentes, cada um ao seu ritmo (ver os comentários
  // dos intervalos acima). Correm em paralelo e param os dois com
  // scanLoopAtivo.
  if (scanBarcodeReader) loopCodigoBarras();
  if (scanWorker) loopOcr();
}

// Fecha a câmara, liberta o motor de OCR e o leitor de código de barras, e
// para o ciclo de leitura — usado tanto ao cancelar como depois de
// confirmar um candidato.
function fecharScanAoVivo() {
  scanLoopAtivo = false;
  scanCandidatoAtual = '';
  scanEstadoLeitura = { ultima: '', count: 0 };
  scanEstadoCodigoBarras = { ultima: '', count: 0 };
  if (scanStream) {
    scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
  }
  if (scanWorker) {
    scanWorker.terminate();
    scanWorker = null;
  }
  scanBarcodeReader = null;
  // Larga o vídeo. Parar as tracks apaga a imagem em movimento mas deixa o
  // ÚLTIMO fotograma congelado no elemento — que reaparecia por um instante
  // na abertura seguinte da câmara, dando a ideia de que já estava a ler
  // (uma imagem velha) antes de a câmara real arrancar.
  const video = document.getElementById('scan-video');
  video.pause();
  video.srcObject = null;
  document.getElementById('scan-overlay').classList.remove('open');
}

// Escape fecha a câmara, tal como o "x" no canto. É o gesto esperado em
// qualquer overlay a ecrã inteiro, e evita ficar preso com a câmara ligada
// em teclado/desktop.
window.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!document.getElementById('scan-overlay').classList.contains('open')) return;
  fecharScanAoVivo();
});

// "Continuar a tentar": descarta o candidato mostrado e volta ao estado de
// leitura — o ciclo em si nunca parou, só estava à espera de decisão.
function continuarScan() {
  document.getElementById('scan-candidate').style.display = 'none';
  scanCandidatoAtual = '';
  scanEstadoLeitura = { ultima: '', count: 0 };
  scanEstadoCodigoBarras = { ultima: '', count: 0 };
  document.getElementById('scan-status').textContent = 'A tentar ler o código…';
}

// "Usar este código": fecha a câmara e preenche a pesquisa com o
// candidato atual — a pessoa ainda revê/corrige antes de pesquisar.
function usarCandidato() {
  const digitos = scanCandidatoAtual;
  fecharScanAoVivo();
  if (!digitos) return;
  const inp = document.getElementById('search-input-artigo');
  inp.value = digitos;
  inp.focus();
  inp.select();
  // Preencher .value por código NÃO dispara o evento "input" — só a escrita
  // da pessoa é que o dispara. Sem esta chamada, o oninput="onSearchInput()"
  // da caixa nunca corria e o código aparecia lá escrito sem nenhuma
  // pesquisa a acontecer; só apagando um caráter (aí sim, um "input" a
  // sério) é que a app reagia. As outras duas funções que preenchem a
  // pesquisa por código — irParaSupermercadoNoIndice e irParaArtigoNoIndice
  // — já tratavam disto; esta tinha ficado de fora.
  // Chama-se onSearchInput() e não doSearch() diretamente para reaproveitar
  // a limpeza de estado que ele faz (selectedIndexKey e companhia), senão a
  // ficha escolhida numa pesquisa anterior podia continuar a aparecer por
  // cima do artigo acabado de ler. O btn-clear passa a ser tratado lá
  // dentro, por doSearch.
  onSearchInput();
}

// (B) Prepara o fotograma para o OCR: recorta a zona da moldura, amplia-a
// e converte-a a preto e branco. Devolve o canvas já pronto a enviar para
// o Tesseract.
function prepararFotogramaParaOcr(video, canvas) {
  const rect = calcularRetanguloRecorte(video.videoWidth, video.videoHeight, SCAN_WRAP_ASPECT, SCAN_FRAME_INSET);
  canvas.width = rect.width * SCAN_AMPLIACAO;
  canvas.height = rect.height * SCAN_AMPLIACAO;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, rect.x, rect.y, rect.width, rect.height, 0, 0, canvas.width, canvas.height);
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  // SEM segundo argumento de propósito: assim aplicarLimiarPB usa o limiar
  // calculado a partir da própria imagem (Otsu). Passar aqui um número fixo
  // — como o 150 que ficou cá até à v1.34.0 — anula o cálculo por completo
  // e é exatamente a avaria que o Otsu foi escrito para resolver.
  aplicarLimiarPB(imgData.data);
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}

// Prepara o fotograma para o CÓDIGO DE BARRAS: o fotograma inteiro, tal
// como sai da câmara, sem recorte nem preto-e-branco.
//
// Esta função é a correção central da v1.28.0. Até aqui o código de
// barras era lido do MESMO canvas preparado para o OCR, e esse canvas é
// inútil para um leitor de códigos de barras por três razões
// independentes, cada uma bastando para nunca haver leitura nenhuma:
//   1. o recorte é uma faixa estreita apontada à LINHA DO NÚMERO, e o
//      código de barras da etiqueta está POR BAIXO do texto — ou seja,
//      fora do recorte. O ZXing recebia uma imagem que nem sequer continha
//      o código de barras;
//   2. mesmo apanhando parte das barras, o recorte corta as margens
//      brancas laterais ("quiet zones"), que o Code 39 exige para ser
//      reconhecido;
//   3. o preto-e-branco por limiar único destrói as barras finas, e é
//      trabalho a dobrar: o ZXing já faz a sua própria binarização, local
//      e bastante melhor, a partir da imagem em tons de cinzento.
function prepararFotogramaParaCodigoBarras(video, canvas) {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  return canvas;
}

// Tenta ler o código de barras (ZXing) no fotograma. Devolve os dígitos
// encontrados, ou '' se não houver nenhum código de barras nesse
// fotograma — isto é o caso normal em muitas tentativas (a etiqueta pode
// estar num ângulo ou distância que ainda não dá para ler), não um erro.
async function tentarLerCodigoBarras(fotograma) {
  try {
    const resultado = await scanBarcodeReader.decodeFromCanvas(fotograma);
    return digitosValidos(resultado.getText());
  } catch (err) {
    return ''; // nenhum código de barras encontrado neste fotograma
  }
}

// Mostra um candidato encontrado e deixa a decisão à pessoa. Os dois
// ciclos param de ler enquanto houver candidato à espera de resposta
// (testam scanCandidatoAtual), e voltam a ler em continuarScan().
function mostrarCandidato(digitos) {
  scanCandidatoAtual = digitos;
  document.getElementById('scan-candidate-num').textContent = digitos;
  document.getElementById('scan-candidate').style.display = 'flex';
  document.getElementById('scan-status').textContent = 'Código encontrado:';
}

// Ciclo do código de barras: tenta a cada SCAN_BARCODE_INTERVALO_MS, sobre
// o fotograma inteiro.
//
// Exige 2 leituras iguais seguidas, tal como o OCR. A v1.28.0 tinha
// dispensado essa confirmação, com o argumento de que o ZXing só dá um
// código como lido depois de validar a estrutura das barras. O argumento
// não se sustentou: apontando a câmara a uma etiqueta que NÃO TEM código
// de barras nenhum, o scan apresentou "08189271" como código encontrado.
// O Code 39 não tem dígito de controlo, e num fotograma tremido as
// sombras chegam para o ZXing julgar ver barras — ainda por cima com o
// TRY_HARDER ligado, que o autoriza a esforçar-se mais por fotograma.
// Um falso positivo custa mais do que os ~0,12 s da segunda leitura, que
// é o tempo de um ciclo.
async function loopCodigoBarras() {
  const video  = document.getElementById('scan-video');
  const canvas = document.getElementById('scan-canvas-barcode');

  while (scanLoopAtivo) {
    if (video.videoWidth && !scanCandidatoAtual) {
      const digitos = await tentarLerCodigoBarras(prepararFotogramaParaCodigoBarras(video, canvas));
      if (!scanLoopAtivo) break; // fechado/confirmado enquanto a leitura corria
      scanEstadoCodigoBarras = processarLeituraConsecutiva(scanEstadoCodigoBarras, digitos);
      if (scanEstadoCodigoBarras.confirmado && !scanCandidatoAtual) {
        mostrarCandidato(scanEstadoCodigoBarras.ultima);
      }
    }
    if (!scanLoopAtivo) break;
    await new Promise(resolve => setTimeout(resolve, SCAN_BARCODE_INTERVALO_MS));
  }
}

// ── Modo de diagnóstico do scan ─────────────────────────
// Desligado por omissão; nada disto corre com ele desligado. Ligado, mostra
// a faixa tal como vai para o motor, o texto cru devolvido e a razão da
// escolha, e deixa guardar as imagens para se poder analisar uma etiqueta
// que não lê em vez de imaginar como ela seria.
let scanDiagAtivo = false;

function alternarDiagnosticoScan() {
  scanDiagAtivo = !scanDiagAtivo;
  document.getElementById('scan-diag').classList.toggle('aberto', scanDiagAtivo);
  document.getElementById('scan-diag-toggle').classList.toggle('ativo', scanDiagAtivo);
  if (!scanDiagAtivo) return;
  // Sem motor não há ciclo de OCR a correr, e o painel ficaria calado para
  // sempre sem se perceber que a causa é essa e não a etiqueta.
  document.getElementById('scan-diag-texto').textContent = scanWorker
    ? 'À espera da primeira leitura…'
    : 'O motor de OCR não foi carregado — só o código de barras está a funcionar. '
      + 'Costuma ser a rede a bloquear a descarga do motor; liga-te à internet e reabre a câmara.';
}

// Põe em texto o que aconteceu numa tentativa de OCR.
function textoDiagnosticoOcr(data, fotograma, video, msDecorridos) {
  const { escolhido, motivo } = explicarEscolhaOcr(data);
  const linhas = resumirLinhasOcr(data);
  const rect = calcularRetanguloRecorte(video.videoWidth, video.videoHeight, SCAN_WRAP_ASPECT, SCAN_FRAME_INSET);

  const partes = [
    `câmara ${video.videoWidth}x${video.videoHeight} → faixa ${rect.width}x${rect.height} @ ${rect.x},${rect.y}` +
      ` → enviado ${fotograma.width}x${fotograma.height}  (${msDecorridos} ms)`,
    '',
    `escolhido: ${escolhido || '— nada —'}`,
    `motivo: ${motivo}`,
    '',
    `linhas lidas (${linhas.length}):`,
  ];
  if (!linhas.length) {
    partes.push('  (nenhuma)');
    partes.push(`  texto corrido: ${JSON.stringify(String((data && data.text) || '').trim())}`);
  } else {
    linhas.forEach((l, i) => {
      partes.push(`  ${i + 1}. alt ${String(l.altura).padStart(3)}px  díg ${l.digitos || '—'}  texto ${JSON.stringify(l.texto)}`);
    });
  }
  return partes.join('\n');
}

// Desenha no painel a MESMA imagem que foi entregue ao motor.
function mostrarDiagnosticoOcr(data, fotograma, video, msDecorridos) {
  const alvo = document.getElementById('scan-diag-canvas');
  alvo.width = fotograma.width;
  alvo.height = fotograma.height;
  alvo.getContext('2d').drawImage(fotograma, 0, 0);
  document.getElementById('scan-diag-texto').textContent =
    textoDiagnosticoOcr(data, fotograma, video, msDecorridos);
}

// Guarda em ficheiro a faixa enviada ao OCR, ou o fotograma inteiro. O
// fotograma inteiro serve para se ver se a moldura está apontada ao sítio
// certo — coisa que a faixa sozinha não mostra.
function guardarFotogramaScan(qual) {
  const video = document.getElementById('scan-video');
  if (!video.videoWidth) return;
  const canvas = document.createElement('canvas');
  if (qual === 'faixa') {
    prepararFotogramaParaOcr(video, canvas);
  } else {
    prepararFotogramaParaCodigoBarras(video, canvas);
  }
  const carimbo = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const link = document.createElement('a');
  link.download = `scan-${qual}-${carimbo}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// Tira o código da resposta do Tesseract, preferindo as linhas com caixa
// (ver escolherCodigoDasLinhas).
//
// A reserva pelo texto corrido existe para o caso de uma versão do
// Tesseract não devolver as linhas nesta forma: aí perde-se a escolha por
// altura e volta-se ao comportamento antigo, que acerta nas etiquetas em
// que a faixa apanha só o número. Vale mais um OCR pior do que um OCR que
// deixa de devolver seja o que for por a resposta ter mudado de formato.
function lerCodigoDaResposta(data) {
  const linhas = data && data.lines;
  if (linhas && linhas.length) return escolherCodigoDasLinhas(linhas);
  return digitosValidos(data && data.text);
}

// Ciclo do OCR (reserva, para etiquetas em que o código de barras está
// rasgado, tapado ou gasto): recorta a faixa da moldura, amplia-a e
// converte-a a preto e branco antes de a enviar ao Tesseract. Espera
// SCAN_INTERVALO_MS entre tentativas. Aqui a confirmação por 2 leituras
// iguais seguidas mantém-se: o OCR não tem forma de validar o que leu, e
// uma leitura isolada mal interpretada é comum.
async function loopOcr() {
  const video  = document.getElementById('scan-video');
  const canvas = document.getElementById('scan-canvas');

  while (scanLoopAtivo) {
    if (video.videoWidth && !scanCandidatoAtual) {
      try {
        const fotograma = prepararFotogramaParaOcr(video, canvas);
        // O terceiro argumento pede as linhas com as respectivas caixas —
        // sem ele o Tesseract devolve só o texto corrido, e é a ALTURA de
        // cada linha que distingue o código do resto da etiqueta.
        const inicio = Date.now();
        const { data } = await scanWorker.recognize(fotograma, {}, { blocks: true, text: true });
        if (!scanLoopAtivo) break; // fechado/confirmado enquanto o OCR corria
        if (scanDiagAtivo) mostrarDiagnosticoOcr(data, fotograma, video, Date.now() - inicio);
        scanEstadoLeitura = processarLeituraConsecutiva(scanEstadoLeitura, lerCodigoDaResposta(data));
        if (scanEstadoLeitura.confirmado && !scanCandidatoAtual) {
          mostrarCandidato(scanEstadoLeitura.ultima);
        }
      } catch (err) {
        // Falha pontual de leitura (ex: fotograma desfocado) — ignora-se e
        // tenta-se outra vez no próximo ciclo, sem interromper o scan.
        // Com o diagnóstico ligado o erro aparece, em vez de a leitura
        // simplesmente não acontecer sem se perceber porquê.
        if (scanDiagAtivo) {
          document.getElementById('scan-diag-texto').textContent = 'Erro na leitura: ' + (err && err.message ? err.message : String(err));
        }
      }
    }
    if (!scanLoopAtivo) break;
    await new Promise(resolve => setTimeout(resolve, SCAN_INTERVALO_MS));
  }
}

// Ordena uma lista de supermercados pelo nome, por ordem alfabética
// (localeCompare 'pt' — ignora maiúsculas/minúsculas e acentos). Devolve
// uma cópia nova, sem alterar o array recebido. Testado em
// sort-supermercados.test.mjs. Usada na
// ficha de artigo (secção "Supermercados") para ordenar os badges dentro
// de cada grupo HPH/ACES/Outro.
function ordenarSupermercadosAlfabeticamente(lista) {
  return [...lista].sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
}

// ── Render ─────────────────────────────────────────────
// Escapa texto vindo dos ficheiros antes de o injetar via innerHTML.
// A plica (') está aqui de propósito, apesar de todos os atributos deste
// ficheiro usarem aspas duplas: é uma linha de defesa barata contra o dia
// em que alguém escrever um atributo com plicas e a descrição de um artigo
// contiver uma.
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Decide, para uma dimensão (Local/grupo ou Área), se se mostra um badge
// fixo (1 só valor distinto entre os artigos da ficha — nada para filtrar)
