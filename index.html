<!--
  Consulta de Artigos — v1.38.0
  Semantic Versioning (https://semver.org)

  Changelog:
  v1.38.0 (atual)
    - fix: o OCR lia o código certo e deitava-o fora. O modo de diagnóstico
      da v1.37.0 mostrou-o numa etiqueta real: o motor devolvia as três
      linhas correctamente, incluindo "1260500100", mas a regra de escolha
      não ficava com nenhuma. A regra da v1.36.0 dava a vitória à linha de
      LETRA MAIOR, e nesta etiqueta os campos têm todos o mesmo tamanho —
      122, 126 e 116 pixéis. Sem uma linha claramente maior, a regra
      abstinha-se, que era o comportamento pedido mas dava em "não lê"
    - fix: a escolha passa a ser pelo CAMPO e pelo formato, não pelo
      tamanho da letra. Havendo o campo "Produto" na imagem, olha-se só
      para a faixa horizontal dele; não havendo, procura-se em todas as
      linhas. Em qualquer dos casos só se aceita um número de exactamente
      10 dígitos, e só se for único
    - fix: deixa de haver lista branca de caracteres no motor. Parecia
      acertada — da etiqueta só interessam números — mas fazia mal por
      duas vias: apagava os nomes dos campos ("Produto:"), que são o que
      diz qual dos números é o código, e apagava as letras dentro dos
      valores. O "B" de "B1240001940" desaparecia e o Tag ficava com 10
      dígitos, o mesmo comprimento do código do produto e impossível de
      distinguir. Com as letras activadas o Tag fica com 11
    - fix: um código de barras passa a precisar de 2 leituras iguais
      seguidas, como já acontecia no OCR. A v1.28.0 tinha dispensado essa
      confirmação por o ZXing validar a estrutura das barras; o argumento
      não se sustentou. Apontada a câmara a uma etiqueta SEM código de
      barras nenhum, o scan apresentou "08189271" como código encontrado.
      O Code 39 não tem dígito de controlo e num fotograma tremido as
      sombras chegam para o leitor julgar ver barras. A segunda leitura
      custa ~0,12 s, um ciclo
    - nota: medido com o Tesseract sobre a etiqueta real reconstruída, em
      quatro condições de luz e foco. Antes: 0 em 5. Depois: 5 em 5. A
      leitura verdadeira do telemóvel está guardada como caso de teste
  v1.37.0
    - feat: modo de diagnóstico no scan, desligado por omissão (botão
      "Diagnóstico" por baixo do estado). Mostra a faixa exactamente como
      ela vai para o motor de OCR, o texto cru que ele devolveu linha a
      linha (com a altura e os dígitos de cada uma), qual foi o candidato
      escolhido e porquê, o tamanho do fotograma e do recorte, e quanto
      tempo demorou. Dois botões guardam a faixa e o fotograma inteiro em
      PNG — o fotograma inteiro serve para se ver se a moldura está
      apontada ao sítio certo, coisa que a faixa sozinha não mostra
    - nota: isto existe porque as duas avarias do OCR (v1.35.0 e v1.36.0)

      apareceu porque as inventadas tinham uma linha e as verdadeiras têm
      três. Da próxima vez que uma etiqueta não ler, dá para ver o que o
      motor viu em vez de se adivinhar
    - nota: com o diagnóstico desligado não corre nada disto; o ciclo de
      leitura fica exactamente como estava
  v1.36.0
    - fix: o OCR continuava a não ler etiquetas reais depois da v1.35.0.
      Testado com a câmara numa etiqueta a sério: código de barras lia,
      OCR não. A causa era outra, e a v1.35.0 não lhe tocou.
      O motor estava configurado com PSM.SINGLE_LINE, que promete à
      biblioteca que a imagem tem UMA linha de texto e mais nada. A faixa
      recortada quase nunca é assim: apanha o fim da descrição em cima e a
      posição em baixo. Com uma linha vizinha o motor devolvia dígitos
      trocados; com duas, não devolvia rigorosamente nada — o sintoma
      relatado. Passa a usar-se PSM.SPARSE_TEXT, que procura o texto onde
      ele estiver e devolve as linhas separadas
    - fix: mesmo quando o número era lido, os dígitos das linhas vizinhas
      eram colados a ele. "COMPRESSA ... 10X10" + "4827516" + "POS: A-12"
      saía como 10104827516012, que não corresponde a artigo nenhum. Cada
      linha passa a ser avaliada por si
    - fix: de entre as linhas, passa a ganhar a de LETRA MAIOR e não a que
      tem mais dígitos. O código do artigo é o texto grande da etiqueta;
      descrição, lote e posição são miudinhos. Escolher pelo comprimento
      parecia o mais natural mas erra em dois casos vulgares: um código de
      4 dígitos empata com o "10X10" da descrição, e um número de lote
      comprido ganha sempre ao código. Se a linha maior não for claramente
      maior que a seguinte (35%), não se escolhe nada e tenta-se no ciclo
      seguinte — mais vale não mostrar nada do que mostrar o número errado
    - nota: medido com o Tesseract sobre etiquetas de três linhas em quatro
      condições de luz e foco. Antes: 12 acertos em 28, e só nos casos em
      que a faixa apanhava apenas o número. Depois: 28 em 28. É por isso
      que os testes sintéticos da v1.35.0 passavam e a etiqueta real não
      lia — as imagens de teste tinham uma linha só
  v1.35.0
    - fix: a leitura do código por OCR continuava a não funcionar em boa

    - nota: medido com o mesmo motor (Tesseract 5.1.1, dígitos em linha
      única) sobre etiquetas geradas em três condições de luz. Com o 150
      fixo, uma etiqueta na sombra não devolvia número nenhum; com o Otsu

    - test: o repositório passa a ter testes automatizados e CI (GitHub

      teste referidos nos comentários deste ficheiro desde a v1.18.0 nunca

    - test: os testes correm contra o index.html PUBLICADO — extraem dele as

    - test: há também verificação de coerência da versão (título, meta,

  v1.29.1
    - fix: no PC saía uma página, no telemóvel saíam duas (a etiqueta e uma

  v1.28.3

  v1.28.2

  v1.28.1

  v1.28.0
    - fix: o scan ao vivo NUNCA conseguia ler um código de barras. Desde a
      v1.18.0 que o código de barras era procurado no mesmo fotograma já
      preparado para o OCR — e esse fotograma está recortado à faixa

      recorte nem preto-e-branco; o OCR mantém o recorte, que é o que lhe
      faz falta
    - fix: uma falha a descarregar o motor de OCR fechava a câmara e
      acabava o scan — levando atrás a leitura de códigos de barras, que
      não precisa de rede nenhuma. Numa rede que bloqueie os domínios do
      Tesseract, isto deixava o scan completamente inútil. Agora perde-se
      só o OCR e o código de barras continua a funcionar
    - fix: com as bibliotecas de CDN em falta, o scan rebentava a meio e
      deixava o overlay aberto com a câmara ligada e sem mensagem nenhuma.
      Passa a haver verificação e aviso antes de abrir a câmara
    - fix: o limiar de preto-e-branco do OCR estava fixo em 150, valor que
      só serve com a etiqueta bem iluminada — na sombra do armazém a
      imagem ficava toda preta e sob o foco ficava toda branca, e em
      qualquer dos casos o motor não tinha nada para ler. O limiar passa a
      ser calculado a partir da própria imagem (método de Otsu)
    - perf: o código de barras passa a ser tentado a cada ~0,12 s, num
      ciclo próprio, em vez de esperar pelo OCR e pelos 1,5 s seguintes.
      Antes havia cerca de uma tentativa a cada 2-4 segundos, e quase
      nunca calhava num fotograma nítido
    - change: um código de barras lido passa a ser aceite à primeira, sem
      a confirmação por 2 leituras iguais seguidas (que se mantém para o
      OCR). O ZXing só dá um Code 39/EAN como lido depois de validar a
      estrutura das barras — repetir só obrigava a segurar o telemóvel
      imóvel mais uns segundos sem ganho nenhum de fiabilidade
    - fix: a câmara era aberta sem pedir resolução, e muitos telemóveis
      davam 640x480 — depois de recortar a faixa, sobrava texto
      irreconhecível. Passa a pedir-se a resolução mais alta disponível e
      a ligar-se o foco automático contínuo quando o aparelho o suporta.
      O pedido de câmara traseira passa a ser "ideal" em vez de exato, que
      fazia o scan não abrir de todo em aparelhos sem traseira declarada
  v1.27.1
    - fix (segurança): a biblioteca que lê os ficheiros Excel (SheetJS/xlsx)
      estava fixada na 0.18.5 vinda do cdnjs, que tem duas vulnerabilidades
      conhecidas — prototype pollution (CVE-2023-30533) e ReDoS
      (CVE-2024-22363), ambas acionáveis por um ficheiro .xlsx preparado
      para o efeito. Passa a ser usada a 0.20.3, que corrige as duas.
      Não chegava trocar o número da versão no URL: a SheetJS deixou de
      publicar no registry público depois da 0.18.5, por isso nenhuma CDN
      pública (cdnjs, jsdelivr, unpkg) tem uma versão corrigida. A
      biblioteca passa a ser servida a partir deste repositório
    - a mesma mudança tira uma dependência de CDN do arranque offline: o
      xlsx era uma das três bibliotecas guardadas em modo best-effort, e
      numa rede que bloqueasse o cdnjs a app abria offline mas ficava sem
      conseguir ler ficheiro nenhum. Agora é um ficheiro local, garantido
      pelo precache obrigatório

    - fix: modo offline podia nunca chegar a funcionar. O Service Worker

      ser guardados à parte e as bibliotecas em modo best-effort
    - fix: a biblioteca ZXing vinha de "@latest" (alvo em movimento: uma

      que responde com redirecionamento — e respostas redirecionadas não
      podem ser guardadas em cache, pelo que o scan por código de barras
      nunca ficava disponível offline. Versão fixada em 0.2.1, com o
      caminho completo do ficheiro
    - fix: Service Worker guardava também respostas de erro (404/500) por
      cima da cópia boa, que passavam a ser o que a app mostrava offline;
      e tentava usar a cache em pedidos que a Cache API não aceita (não-GET,

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],
      [6, 26, 50, 74],
      [6, 30, 54, 78],
      [6, 30, 56, 82],
      [6, 30, 58, 86],
      [6, 34, 62, 90],
      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],

<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: #e2e0d8;
    --border2: #cac8be;
    --text: #1a1916;
    --text2: #6b6960;
    --text3: #a09e96;
    --blue-bg: #e8f0fb;
    --blue-txt: #1a4fa0;
    --green-bg: #e4f3e8;
    --green-txt: #1a6632;
    --amber-bg: #fef3db;
    --amber-txt: #8a5a00;
    --red-bg: #fde8e8;
    --red-txt: #991818;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; gap: 16px; height: 56px; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 16px; font-weight: 600; color: var(--text); }
  header .header-logo { border-radius: 6px; display: block; flex-shrink: 0; object-fit: cover; }
  header .sep { width: 1px; height: 20px; background: var(--border); }
  header .subtitle { font-size: 13px; color: var(--text2); }
  .version { font-size: 11px; background: var(--surface2); border: 1px solid var(--border); border-radius: 99px; padding: 2px 9px; color: var(--text2); margin-left: auto; }

  /* LAYOUT */
  .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* UPLOAD SECTION */
  .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem; }
  .upload-card { background: var(--surface); border: 1.5px dashed var(--border2); border-radius: var(--radius); padding: 1.5rem; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
  .upload-card:hover { border-color: var(--blue-txt); background: var(--blue-bg); }
  .upload-card.loaded { border-style: solid; border-color: #1a6632; background: var(--green-bg); }
  .upload-card:focus-visible { outline: 2px solid var(--blue-txt); outline-offset: 2px; }
  .upload-card svg { width: 32px; height: 32px; color: var(--text3); margin-bottom: 8px; }
  .upload-card.loaded svg { color: var(--green-txt); }
  .upload-card .uc-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .upload-card .uc-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .upload-card .uc-count { font-size: 12px; color: var(--green-txt); font-weight: 500; margin-top: 6px; }
  .upload-card input[type=file] { display: none; }
  .auto-load-status { font-size: 12.5px; color: var(--text2); text-align: center; padding: 10px; margin-bottom: 1rem; display: none; }

  /* UPLOAD BAR (estado colapsado, depois de ambos os ficheiros carregados) */
  .upload-bar { display: none; align-items: center; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--text2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: 1.5rem; background: var(--surface); }
  .upload-bar .ub-status { display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .upload-bar .ub-status svg { width: 14px; height: 14px; color: var(--green-txt); flex-shrink: 0; }
  .upload-bar .ub-files { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .upload-bar button.ub-switch { background: none; border: none; padding: 0; font: inherit; font-size: 12.5px; color: var(--blue-txt); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; flex-shrink: 0; }
  .upload-bar button.ub-switch:hover { color: var(--text); }
  .upload-bar .ub-sep { color: var(--border2); flex-shrink: 0; }

  /* SEARCH MODE TOGGLE */
  .mode-toggle { display: flex; gap: 4px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; margin-bottom: 10px; }
  .mode-btn { flex: 1; border: none; background: none; padding: 8px 10px; font: inherit; font-size: 13px; font-weight: 600; color: var(--text2); border-radius: var(--radius-sm); cursor: pointer; transition: background 0.15s, color 0.15s; }
  .mode-btn:hover { color: var(--text); }
  .mode-btn.active { background: var(--surface); color: var(--blue-txt); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .mode-btn:disabled { cursor: not-allowed; opacity: 0.6; }

  /* SEARCH */
  .search-wrap { position: relative; margin-bottom: 1.5rem; }
  .search-wrap svg.icon-search { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text3); pointer-events: none; }
  /* Uma classe partilhada pelas três caixas (Artigos / Supermercados /
     Etiqueta), em vez de uma lista de #id. Com a lista de ids, a caixa do
     modo Etiqueta acrescentada na v1.25.0 ficou de fora de todas estas

     cantos redondos e sem espaço para o ícone da lupa. */
  .search-input { width: 100%; padding: 10px 40px 10px 40px; font-size: 15px; border: 1px solid var(--border2); border-radius: var(--radius); background: var(--surface); color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s; font-family: inherit; }
  .search-input:focus { border-color: var(--blue-txt); box-shadow: 0 0 0 3px rgba(26,79,160,0.1); }
  .search-input:disabled { background: var(--surface2); color: var(--text3); cursor: not-allowed; }
  #btn-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text3); padding: 4px; display: none; border-radius: 99px; }
  #btn-clear:hover { color: var(--text); background: var(--surface2); }

  /* SCAN (OCR ao vivo) */

  #btn-scan:hover { color: var(--blue-txt); background: var(--surface2); }
  #btn-scan:disabled { cursor: not-allowed; opacity: 0.5; }
  .ocr-msg { font-size: 12.5px; color: var(--amber-txt); background: var(--amber-bg); border-radius: var(--radius-sm); padding: 8px 12px; margin: -10px 0 1.5rem; display: none; }

  .scan-overlay { position: fixed; inset: 0; background: rgba(10,10,8,0.94); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .scan-overlay.open { display: flex; }
  .scan-video-wrap { position: relative; width: 100%; max-width: 440px; aspect-ratio: 3 / 4; background: #000; border-radius: var(--radius); overflow: hidden; }
  #scan-video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scan-frame-hint { position: absolute; inset: 40% 8%; border: 2px dashed rgba(255,255,255,0.55); border-radius: 8px; pointer-events: none; }
  .scan-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }
  .scan-close { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.45); border: none; color: #fff; cursor: pointer; padding: 6px; border-radius: 99px; line-height: 0; }
  .scan-status { color: #f2f1ec; font-size: 13px; margin-top: 16px; text-align: center; min-height: 18px; }
  .scan-candidate { margin-top: 14px; display: none; flex-direction: column; align-items: center; gap: 10px; }
  .scan-candidate-num { font-family: 'Cascadia Code', 'Courier New', monospace; font-size: 24px; font-weight: 700; color: #fff; background: rgba(255,255,255,0.14); padding: 8px 20px; border-radius: 8px; letter-spacing: 1px; }
  .scan-actions { display: flex; gap: 10px; }
  /* Modo de diagnóstico do scan: desligado por omissão, ligado pelo botão

  .scan-diag-toggle:hover { color: #fff; border-color: rgba(255,255,255,0.5); }
  .scan-diag-toggle.ativo { color: #fff; border-color: var(--blue-txt); background: var(--blue-txt); }
  .scan-diag { display: none; width: 100%; max-width: 440px; margin-top: 12px; }
  .scan-diag.aberto { display: block; }
  .scan-diag canvas { width: 100%; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; background: #fff; display: block; image-rendering: pixelated; }
  .scan-diag pre { color: #d8d6cf; background: rgba(0,0,0,0.45); border-radius: 4px; font-family: 'Cascadia Code', 'Courier New', monospace; font-size: 10.5px; line-height: 1.45; padding: 8px 10px; margin: 8px 0 0; max-height: 190px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .scan-diag-acoes { display: flex; gap: 8px; margin-top: 8px; }
  .scan-diag-acoes button { flex: 1; font: inherit; font-size: 11.5px; padding: 7px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; }
  .scan-diag-acoes button:hover { background: rgba(255,255,255,0.2); }

  .scan-btn { font: inherit; font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: 99px; border: none; cursor: pointer; }
  .scan-btn.primary { background: var(--blue-txt); color: #fff; }
  .scan-btn.secondary { background: rgba(255,255,255,0.16); color: #fff; }

  /* RESULTS */
  #results { display: none; }
  .results-header { font-size: 13px; color: var(--text2); margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }

  /* ARTIGO CARD */
  .artigo-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
  .artigo-card-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 12px; }
  .cod-pill { background: var(--blue-bg); color: var(--blue-txt); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; white-space: nowrap; font-family: 'Cascadia Code', 'Courier New', monospace; }
  .artigo-nome { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; }
  .artigo-card-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; }

  /* SECTION LABEL */
  .sec-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }

  /* ARM GRID */
  .arm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .arm-cell { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; }
  .arm-cell-name { font-size: 11px; color: var(--text2); margin-bottom: 3px; }
  .arm-cell-pos { font-size: 14px; font-weight: 600; color: var(--text); font-family: 'Cascadia Code', 'Courier New', monospace; }
  .arm-cell-um { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .arm-cell-obs { font-size: 11px; color: var(--amber-txt); background: var(--amber-bg); border-radius: 4px; padding: 2px 6px; margin-top: 4px; display: inline-block; }

  /* DIVIDER */
  .divider { border: none; border-top: 1px solid var(--border); }

  /* SUPER TAGS */
  .super-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .super-tag { background: var(--amber-bg); color: var(--amber-txt); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 99px; }
  .super-tag-btn { border: none; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
  .super-tag-btn:hover { background: #f3dfa8; }
  .super-group { margin-bottom: 10px; }
  .super-group:last-child { margin-bottom: 0; }
  .super-group-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); margin-bottom: 6px; }

  /* INFO PANEL */
  .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .info-card { border-radius: var(--radius-sm); padding: 12px 14px; }
  .info-card.neutral { background: var(--surface2); }
  .info-card.blue  { background: var(--blue-bg); }
  .info-card.amber { background: var(--amber-bg); }
  .info-card-title { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .info-card.neutral .info-card-title { color: var(--text2); }
  .info-card.blue  .info-card-title { color: var(--blue-txt); }
  .info-card.amber .info-card-title { color: var(--amber-txt); }
  .info-card-num { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.1; margin-bottom: 6px; }
  .info-card-detail { font-size: 12px; color: var(--text2); line-height: 1.5; word-break: break-word; }

  @media (max-width: 900px) {
    .info-grid { grid-template-columns: 1fr; }
  }

  /* CAIXAS TABLE */
  .cx-wrap { overflow-x: auto; }
  table.cx { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.cx th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); padding: 4px 10px 6px 0; border-bottom: 1px solid var(--border); }
  table.cx td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  table.cx tr:last-child td { border-bottom: none; }
  table.cx td.mono { font-family: 'Cascadia Code', 'Courier New', monospace; font-weight: 600; }
  .cod-link { background: none; border: none; padding: 0; font: inherit; font-family: 'Cascadia Code', 'Courier New', monospace; font-weight: 600; color: var(--blue-txt); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .cod-link:hover { color: var(--text); }
  table.cx td.muted { color: var(--text2); }
  table.cx th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  table.cx th.sortable:hover { color: var(--text); }

  /* ÁREA (filtro na ficha de Serviço) */
  .sgc-header-main { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  .area-filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .area-btn { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); font: inherit; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: 99px; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; }
  .area-btn:hover { color: var(--text); border-color: var(--text3); }
  .area-btn.active { background: var(--blue-bg); color: var(--blue-txt); border-color: var(--blue-txt); }
  .badge-total { background: var(--blue-bg); color: var(--blue-txt); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; font-family: 'Cascadia Code', 'Courier New', monospace; }

  /* CAIXAS POR GRUPO (HPH / ACES) */
  .cxgrp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .cxgrp-col { background: var(--surface2); border-radius: var(--radius-sm); padding: 10px 12px; }
  .cxgrp-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text2); margin-bottom: 8px; }
  .cxgrp-row { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .cxgrp-row:last-child { border-bottom: none; }
  .cxgrp-tipo { font-family: 'Cascadia Code', 'Courier New', monospace; font-weight: 600; font-size: 13px; color: var(--text); }

  /* EMPTY */
  .no-data { color: var(--text3); font-size: 13px; font-style: italic; }
  .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text3); }
  .empty-state svg { width: 44px; height: 44px; margin: 0 auto 12px; display: block; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  @media (max-width: 600px) {
    .upload-grid { grid-template-columns: 1fr; }
    header { padding: 0 1rem; }
    .container { padding: 1.5rem 1rem; }
  }

  /* ── ETIQUETA (23x80mm) ── */
  .etiqueta-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin-top: 4px; }
  .etiqueta {
    width: 80mm; height: 23mm;
    display: grid;
    /* Larguras a contar do desenho original (23 · 22 · 19 · 16mm):
       QR -10% (23 → 20.7), preço -10% (16 → 14.4) e a descrição fica com o
       espaço libertado — 1fr = 22.9mm, +20% sobre os 19mm que tinha */
    grid-template-columns: 20.7mm 22mm 1fr 14.4mm; /* QR · meio · descrição · preço */
    background: #fff; color: #000;
    border: 1px solid #000;
    box-sizing: border-box;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .etiqueta > div { border-right: 1px solid #000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; }
  .etiqueta > div:last-child { border-right: none; }
  .etq-qr { padding: 1mm; background: #fff; }
  /* QR fixo em 18.7mm — a coluna de 20.7mm menos 1mm de padding de cada lado.
     Quadrado e centrado na célula (antes era 100%x100%, dependia da coluna) */
  .etq-qr svg { width: 18.7mm; height: 18.7mm; display: block; }
  .etq-meio { padding: 0; }
  .etq-meio > div { width: 100%; border-bottom: 1px solid #000; display: flex; align-items: center; justify-content: center; flex: 1; }
  .etq-meio > div:last-child { border-bottom: none; }
  .etq-pos { font-weight: 700; font-size: 11px; font-family: 'Cascadia Code', 'Courier New', monospace; }
  .etq-cod-cell { font-size: 10px; font-family: 'Cascadia Code', 'Courier New', monospace; }
  .etq-sgcim { font-size: 8px; letter-spacing: 0.5px; }
  /* O ajustarDescricaoEtiqueta() escreve o font-size final inline no
     .etq-desc-txt, procurando o maior que ainda cabe na célula. Por defeito
     as palavras não se partem (overflow-wrap: normal): parte-se a letra em
     vez da palavra. Só quando nem no tamanho mínimo cabe é que o JS mete
     overflow-wrap: anywhere para partir referências compridas sem espaços */
  .etq-descricao { padding: 1mm; font-size: 10px; line-height: 1.15; background: #fff; }
  .etq-desc-txt { display: block; width: 100%; overflow-wrap: normal; }
  .etq-preco { padding: 1mm; font-size: 10px; font-weight: 600; background: #fff; }
  /* Cor pinta só código + descrição (regra de negócio) */
  .etiqueta.cor-amarelo .etq-cod-cell, .etiqueta.cor-amarelo .etq-descricao { background: #ffec99; }
  .etiqueta.cor-rosa    .etq-cod-cell, .etiqueta.cor-rosa    .etq-descricao { background: #ffd6e7; }
  /* branco = sem alteração (fundo já branco) */
  .etq-print-btn { font: inherit; font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: 99px; border: none; background: var(--blue-txt); color: #fff; cursor: pointer; }
  .etq-print-btn:hover { filter: brightness(1.08); }

  /* Seleção em lote de etiquetas no índice de supermercado */
  .etq-lote-td { width: 28px; text-align: center; }
  .etq-lote-cb { width: 16px; height: 16px; accent-color: #2e7d32; cursor: pointer; }
  .etq-lote-bar { display: flex; justify-content: flex-end; margin-top: 10px; }
  /* Área de impressão: as etiquetas a imprimir são CLONADAS para aqui (um
     filho direto do <body>) e todo o resto do body é escondido com
     display:none. Antes o resto da página era escondido com
     visibility:hidden — o conteúdo continuava a ocupar altura e a
     pré-visualização saía com muitas páginas em branco a seguir à
     etiqueta. Com display:none só sobra a área de impressão. */
  #etq-print-area { display: none; }
  @media print {
    /* A regra de esconder a app NÃO depende da classe .print-etq, de
       propósito: se por alguma razão a área de impressão desaparecer a meio
       (ver prepararAreaDeEtiquetas), o pior que pode sair é UMA página em
       branco — nunca a app inteira paginada em folhas de 23mm, que era o que
       dava as dezenas de páginas. A folha desta app é sempre uma etiqueta. */
    body > *:not(#etq-print-area) { display: none !important; }
    body { margin: 0; padding: 0; background: #fff; }
    #etq-print-area { display: block; }
    #etq-print-area .etiqueta-wrap { display: block; margin: 0; }
    #etq-print-area .etiqueta { margin: 0; }
    /* UMA etiqueta (modo Etiqueta): rolo 23x80mm, uma página exata.
       O overflow:hidden e os break/page-break-after são o que impede uma
       segunda folha em branco quando a impressora (ou o serviço de impressão
       do telemóvel) deixa a área imprimível uns décimos de milímetro mais
       pequena do que a folha pedida. O font-size:0 é para nenhum espaço
       branco solto dentro da área criar uma linha de texto a seguir à
       etiqueta — as células da etiqueta trazem todas o seu próprio tamanho. */
    body:not(.print-lote) #etq-print-area {
      width: 80mm; height: 23mm; overflow: hidden;
      font-size: 0; line-height: 0;
      break-inside: avoid; page-break-inside: avoid;
      break-after: avoid; page-break-after: avoid;
    }
    /* LOTE: várias etiquetas seguidas na mesma folha A4 (a regra @page A4
       é injetada por imprimirEtiquetasLote, para não afetar a impressão
       de uma etiqueta única em rolo). */
    body.print-lote #etq-print-area .etiqueta { margin: 0 0 3mm; break-inside: avoid; page-break-inside: avoid; }
    .etq-print-btn { display: none; }
    @page { size: 80mm 23mm; margin: 0; }
  }
</style>
</head>
<body>

<header>
  <img src="icon-192.png" alt="" width="26" height="26" class="header-logo">
  <h1>Consulta de Artigos</h1>
  <div class="sep"></div>
  <span class="subtitle">Armazém · Posição · Supermercados · Caixas</span>
  <span class="version">v1.38.0</span>
</header>

<div class="container">

  <!-- A app é inteiramente JavaScript (lê os Excel no próprio browser).
       Sem JS não há nada para mostrar — mais vale dizê-lo do que deixar
       uma página em branco sem explicação. -->
  <noscript>
    <div class="ocr-msg" style="display:block">
      Esta aplicação precisa de JavaScript para ler os ficheiros Excel no
      próprio dispositivo. Ativa o JavaScript no browser e recarrega a página.
    </div>
  </noscript>

  <!-- UPLOAD -->
  <div id="upload-section">
    <div class="auto-load-status" id="auto-load-status">A carregar dados guardados…</div>
    <div class="upload-grid">
      <!-- role/tabindex/onkeydown: os cartões são acionáveis também por
           teclado (Enter ou Espaço), tal como um botão. O <input file>
           real fica escondido dentro do cartão e é aberto pelo clique. -->
      <div class="upload-card" id="z-super" role="button" tabindex="0"
           onclick="document.getElementById('f-super').click()" onkeydown="ativarPorTeclado(event, this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/></svg>
        <div class="uc-title">Supermercados</div>
        <div class="uc-sub">Supermercados / Kanbans</div>
        <div class="uc-count" id="count-super" style="display:none"></div>
        <input type="file" id="f-super" accept=".xlsx" onchange="loadFile(this,'super')">
      </div>
      <div class="upload-card" id="z-arm" role="button" tabindex="0"
           onclick="document.getElementById('f-arm').click()" onkeydown="ativarPorTeclado(event, this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <div class="uc-title">Artigos</div>
        <div class="uc-sub">Armazém / Posições</div>
        <div class="uc-count" id="count-arm" style="display:none"></div>
        <input type="file" id="f-arm" accept=".xlsx" onchange="loadFile(this,'arm')">
      </div>
    </div>
  </div>

  <!-- UPLOAD BAR (visível só depois de ambos os ficheiros estarem carregados) -->
  <div class="upload-bar" id="upload-bar">
    <span class="ub-status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>
      <span class="ub-files" id="ub-files"></span>
    </span>
    <button class="ub-switch" onclick="showUploadSection()">Trocar ficheiros</button>
    <span class="ub-sep">·</span>
    <button class="ub-switch" onclick="esquecerFicheiros()">Esquecer ficheiros</button>
  </div>

  <!-- SEARCH MODE -->
  <div class="mode-toggle">
    <button type="button" class="mode-btn active" id="mode-btn-artigo" onclick="setSearchMode('artigo')" disabled>Artigos</button>
    <button type="button" class="mode-btn" id="mode-btn-super" onclick="setSearchMode('super')" disabled>Supermercados / Serviços</button>
    <button type="button" class="mode-btn" id="mode-btn-etiqueta" onclick="setSearchMode('etiqueta')" disabled>Etiqueta</button>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="search-input" id="search-input-artigo" placeholder="Pesquisar por código ou descrição do artigo…" oninput="onSearchInput()" disabled>
    <input type="text" class="search-input" id="search-input-super" placeholder="Pesquisar por supermercado ou serviço (código ou descrição)…" oninput="onSearchInput()" disabled style="display:none">
    <input type="text" class="search-input" id="search-input-etiqueta" placeholder="Pesquisar supermercado para gerar etiqueta…" oninput="onSearchInput()" disabled style="display:none">
    <button id="btn-scan" onclick="abrirScanAoVivo()" title="Ler código pela câmara" disabled>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
    <button id="btn-clear" onclick="clearSearch()" title="Limpar pesquisa">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="ocr-msg" id="ocr-msg"></div>

  <!-- SCAN AO VIVO (overlay) -->
  <div class="scan-overlay" id="scan-overlay">
    <div class="scan-video-wrap">
      <video id="scan-video" autoplay playsinline muted></video>
      <div class="scan-frame-hint"></div>
      <svg class="scan-crosshair" width="64" height="64" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="18" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.5"/>
        <line x1="32" y1="0"  x2="32" y2="14" stroke="rgba(255,255,255,0.85)" stroke-width="2"/>
        <line x1="32" y1="50" x2="32" y2="64" stroke="rgba(255,255,255,0.85)" stroke-width="2"/>
        <line x1="0"  y1="32" x2="14" y2="32" stroke="rgba(255,255,255,0.85)" stroke-width="2"/>
        <line x1="50" y1="32" x2="64" y2="32" stroke="rgba(255,255,255,0.85)" stroke-width="2"/>
      </svg>
      <button class="scan-close" onclick="fecharScanAoVivo()" title="Fechar câmara">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="scan-status" id="scan-status">A abrir câmara…</div>
    <div class="scan-candidate" id="scan-candidate">
      <span class="scan-candidate-num" id="scan-candidate-num"></span>
      <div class="scan-actions">
        <button type="button" class="scan-btn secondary" onclick="continuarScan()">Continuar a tentar</button>
        <button type="button" class="scan-btn primary" onclick="usarCandidato()">Usar este código</button>
      </div>
    </div>

    <!-- Modo de diagnóstico: desligado por omissão. Serve para perceber
         porque é que uma etiqueta não lê, mostrando a imagem que vai para o
         motor e o que ele devolveu — em vez de se andar a adivinhar a
         partir de etiquetas inventadas, que foi como as avarias do OCR
         escaparam até à v1.36.0. -->
    <button type="button" class="scan-diag-toggle" id="scan-diag-toggle" onclick="alternarDiagnosticoScan()">Diagnóstico</button>
    <div class="scan-diag" id="scan-diag">
      <canvas id="scan-diag-canvas"></canvas>
      <pre id="scan-diag-texto">À espera da primeira leitura…</pre>
      <div class="scan-diag-acoes">
        <button type="button" onclick="guardarFotogramaScan('faixa')">Guardar a faixa</button>
        <button type="button" onclick="guardarFotogramaScan('inteiro')">Guardar o fotograma</button>
      </div>
    </div>
  </div>
  <!-- Dois canvas separados de propósito: o do OCR leva a faixa recortada,
       ampliada e a preto e branco; o do código de barras leva o fotograma
       inteiro em cor (ver prepararFotogramaParaCodigoBarras). Partilhar um
       só canvas entre as duas vias era o que impedia a leitura de códigos
       de barras até à v1.27.1. -->
  <canvas id="scan-canvas" style="display:none"></canvas>
  <canvas id="scan-canvas-barcode" style="display:none"></canvas>

  <!-- RESULTS -->
  <div id="results">
    <div class="results-header" id="results-header"></div>

    <div id="cards-container"></div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────
let superMap = {};   // cod → { nome, supermercados[], caixas[] }
let armMap   = {};   // cod → { descArtigo, posicoes[] }
let superLoaded = false, armLoaded = false;

// ── File loading ───────────────────────────────────────
function loadFile(input, tipo) {
  const file = input.files[0];
  // Repõe o valor do <input type=file> em qualquer saída desta função.
  // Sem isto, escolher OUTRA VEZ o MESMO ficheiro (caso normal depois de
  // "Trocar ficheiros", quando se voltou a exportar o Excel com o mesmo
  // nome) não dispara o evento "change" — o browser considera que o valor
  // não mudou — e a app parecia simplesmente ignorar o clique.
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const buffer = e.target.result;
    // Só se guarda no dispositivo se a leitura correu bem: guardar um
    // ficheiro que a app não consegue interpretar faria com que TODOS os
    // arranques seguintes falhassem a retomar, sem forma óbvia de sair
    // disso a não ser "Esquecer ficheiros".
    if (!processFileBuffer(buffer, tipo, file.name)) return;
    // Guarda os bytes originais no dispositivo (IndexedDB) para a próxima
    // vez que a app abrir não ser preciso voltar a pedir este ficheiro —
    // ver secção "Persistência local (IndexedDB)". Isto substitui
    // automaticamente o que estivesse guardado antes para este tipo.
    guardarFicheiroDB(tipo, buffer, file.name);
  };
  // Sem este onerror, uma falha de leitura (ficheiro removido da pen a
  // meio, permissões, ficheiro corrompido) não dava sinal nenhum: a app
  // ficava exatamente na mesma, como se nada tivesse sido clicado.
  reader.onerror = () => {
    alert('Não foi possível ler o ficheiro "' + file.name + '". Verifica se ainda está acessível e tenta outra vez.');
  };
  reader.readAsArrayBuffer(file);
}

// Interpreta os bytes de um ficheiro .xlsx (ler as linhas, encontrar o
// cabeçalho, processar). Extraído de loadFile para poder ser reutilizado
// tanto no upload manual (acima) como no carregamento automático a partir
// do IndexedDB (ver tentarCarregarGuardado) — as duas vias têm de tratar
// os bytes exatamente da mesma forma.
// Devolve true se o ficheiro foi lido e processado com sucesso, false se
// não — quem chama usa isso para decidir se vale a pena guardá-lo no
// dispositivo (ver loadFile).
function processFileBuffer(buffer, tipo, fname) {
  let raw;
  try {
    const wb  = XLSX.read(buffer, { type: 'array' });
    const ws  = wb.Sheets[wb.SheetNames[0]];
    raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  } catch (err) {
    // Ficheiro que não é um .xlsx válido (ex: .xls antigo, .csv renomeado,
    // ficheiro truncado). Sem este try, a exceção subia pelo onload do
    // FileReader e a app ficava parada sem explicação nenhuma.
    console.warn('Falha ao interpretar o ficheiro Excel:', err);
    alert('Não foi possível abrir "' + fname + '" como ficheiro Excel (.xlsx). Verifica o formato do ficheiro.');
    return false;
  }
  let hRow  = -1;
  for (let i = 0; i < Math.min(10, raw.length); i++) {
    if (raw[i].filter(c => String(c).trim().length > 2).length > 3) { hRow = i; break; }
  }
  if (hRow === -1) { alert('Não foi possível ler o ficheiro. Verifique o formato.'); return false; }
  const headers = raw[hRow].map(c => String(c).trim());
  const rows    = raw.slice(hRow + 1).filter(r => r.some(c => String(c).trim()));

  // Confirma que este ficheiro é mesmo o do tipo em que foi largado, ANTES
  // de substituir os dados já carregados. Sem esta validação, trocar os
  // dois ficheiros (o Consumo no cartão "Supermercados", por exemplo) era
  // aceite em silêncio: as colunas procuradas não existiam, saía tudo
  // vazio, e a app dizia apenas "0 artigos" sem dizer porquê.
  const erroTipo = validarCabecalho(headers, tipo);
  if (erroTipo) { alert(erroTipo); return false; }

  if (tipo === 'super') processSuperFile(headers, rows, fname);
  else                  processArmFile(headers, rows, fname);
  return true;
}

// Colunas mínimas que cada ficheiro tem obrigatoriamente de ter para a app
// conseguir fazer alguma coisa com ele. Escolhidas por serem específicas
// de cada ficheiro (não existem no outro), para servirem também de
// deteção de "ficheiro trocado".
const COLUNAS_OBRIGATORIAS = {
  super: [['Código Artigo', 'Codigo Artigo'], ['Supermercado']],
  arm:   [['Código Artigo', 'Codigo Artigo'], ['Descrição Armazém', 'Descricao Armazem', 'Armazém']],
};
const NOME_TIPO = { super: 'Supermercados', arm: 'Artigos' };

// Devolve '' se o cabeçalho serve para o tipo pedido, ou a mensagem de
// erro a mostrar à pessoa se não servir.
function validarCabecalho(headers, tipo) {
  const emFalta = COLUNAS_OBRIGATORIAS[tipo].filter(termos => col(headers, termos) === -1);
  if (!emFalta.length) return '';
  const outro = tipo === 'super' ? 'arm' : 'super';
  const pareceOOutro = COLUNAS_OBRIGATORIAS[outro].every(termos => col(headers, termos) !== -1);
  const faltam = emFalta.map(termos => '"' + termos[0] + '"').join(', ');
  if (pareceOOutro) {
    return 'Este ficheiro parece ser o de "' + NOME_TIPO[outro] + '", não o de "' + NOME_TIPO[tipo] + '"'
      + ' (não tem as colunas ' + faltam + '). Carrega-o no outro cartão.';
  }
  return 'O ficheiro não tem as colunas necessárias para "' + NOME_TIPO[tipo] + '": ' + faltam + '.'
    + ' Confirma que é o export correto e que o cabeçalho não foi alterado.';
}

// Prefere correspondência EXATA do cabeçalho; só recorre a substring se não
// houver exata. Sem isto, procurar "Artigo" apanhava "Código Artigo" (porque
// contém "artigo"), e "Supermercado" apanhava "Código Supermercado".
function col(headers, terms) {
  for (const t of terms) {
    const i = headers.findIndex(h => h.toLowerCase() === t.toLowerCase());
    if (i !== -1) return i;
  }
  for (const t of terms) {
    const i = headers.findIndex(h => h.toLowerCase().includes(t.toLowerCase()));
    if (i !== -1) return i;
  }
  return -1;
}

function v(row, i) { return i !== -1 ? String(row[i] || '').trim() : ''; }
function n(row, i) { return i !== -1 && row[i] !== '' ? row[i] : ''; }

// Classifica o valor da coluna "Local" em HPH, ACES ou Outro. Feito por
// palavra-chave (não exato) para tolerar variações tipo "HPH Braga" ou
// "ACES Porto Oriental".
function classificaLocal(local) {
  const l = local.toUpperCase();
  if (l.includes('ACES')) return 'ACES';
  if (l.includes('HPH'))  return 'HPH';
  return 'Outro';
}

function processSuperFile(headers, rows, fname) {
  const iCod    = col(headers, ['Código Artigo', 'Codigo Artigo']);
  const iNome   = col(headers, ['Artigo']);
  const iSuper  = col(headers, ['Supermercado']);
  const iCodS   = col(headers, ['Código Supermercado', 'Codigo Supermercado']);
  const iServ   = col(headers, ['Serviço', 'Servico']);
  const iCodServ= col(headers, ['Código Serviço', 'Codigo Servico', 'Codigo Servico']);
  const iArea   = col(headers, ['Área', 'Area']);
  const iLocal  = col(headers, ['Local']);
  const iPosicao= col(headers, ['Posição', 'Posicao']);
  const iTipoCx = col(headers, ['Tipo Caixa']);
  const iNrCx   = col(headers, ['Nº Caixas', 'Nr Caixas', 'Numero Caixas']);
  const iQtdCx  = col(headers, ['Quantidade Caixa']);
  const iQtdTot = col(headers, ['Quantidade Total']);

  superMap = {};
  rows.forEach(r => {
    const cod = v(r, iCod);
    if (!cod) return;
    if (!superMap[cod]) superMap[cod] = { nome: '', supermercados: [], servicos: [], caixas: [] };
    const nome = v(r, iNome);
    if (nome && !superMap[cod].nome) superMap[cod].nome = nome;
    const sNome = v(r, iSuper), sCod = v(r, iCodS), sLocal = v(r, iLocal), sPosicao = v(r, iPosicao), sArea = v(r, iArea);
    if (sNome && !superMap[cod].supermercados.find(s => s.nome === sNome))
      superMap[cod].supermercados.push({ cod: sCod, nome: sNome, local: sLocal, grupo: classificaLocal(sLocal), posicao: sPosicao, area: sArea });
    const servNome = v(r, iServ), servCod = v(r, iCodServ);
    if (servNome && !superMap[cod].servicos.find(sv => sv.nome === servNome))
      superMap[cod].servicos.push({ cod: servCod, nome: servNome, area: sArea, local: sLocal, grupo: classificaLocal(sLocal), posicao: sPosicao });
    const tipoCx = v(r, iTipoCx);
    if (tipoCx) {
      // Guarda a linha "em bruto"; a agregação (máximo por tipo+supermercado)
      // é feita depois por aggregateCaixas, pois o export pode ter mais que
      // uma linha para a mesma combinação tipo de caixa + supermercado.
      superMap[cod].caixas.push({ tipoCx, qtdCx: n(r, iQtdCx), nrCx: n(r, iNrCx), qtdTotal: n(r, iQtdTot), superNome: sNome, servNome, grupo: classificaLocal(sLocal) });
    }
  });

  // Colapsa duplicados: para cada (tipo de caixa, supermercado) fica só a
  // linha com a maior Quantidade Total — "quantidade máxima por tipo de caixa".
  // Nota: a versão agregada por Serviço (caixasPorServico) é calculada
  // ANTES desta linha, a partir das mesmas linhas em bruto, porque esta
  // instrução substitui a.caixas pela versão já colapsada por supermercado
  // (que já não tem toda a informação de serviço linha a linha).
  Object.values(superMap).forEach(a => { a.caixasPorServico = aggregateCaixasPorServico(a.caixas); });
  Object.values(superMap).forEach(a => { a.caixas = aggregateCaixas(a.caixas); });

  superLoaded = true;
  invalidarIndicePesquisa();
  markLoaded('z-super', 'count-super', fname, Object.keys(superMap).length + ' artigos', 'super');
  checkReady();
}

// Colapsa linhas duplicadas por (tipoCx, superNome), mantendo a de maior
// Quantidade Total.
function aggregateCaixas(rows) {
  const byKey = new Map();
  for (const r of rows) {
    const key = r.tipoCx + '|' + r.superNome;
    const atual = byKey.get(key);
    const total = Number(r.qtdTotal) || 0;
    if (!atual || total > (Number(atual.qtdTotal) || 0)) byKey.set(key, r);
  }
  return [...byKey.values()];
}

// Colapsa linhas duplicadas por (tipoCx, servNome), mantendo a de maior
// Quantidade Total — mesma lógica de aggregateCaixas, mas agrupada por
// Serviço em vez de Supermercado. Usada para o índice de Serviço poder
// mostrar só as caixas desse serviço, em vez de todas as do artigo.
// Testado em caixas-por-servico.test.mjs.
function aggregateCaixasPorServico(rows) {
  const byKey = new Map();
  for (const r of rows) {
    const key = r.tipoCx + '|' + r.servNome;
    const atual = byKey.get(key);
    const total = Number(r.qtdTotal) || 0;
    if (!atual || total > (Number(atual.qtdTotal) || 0)) byKey.set(key, r);
  }
  return [...byKey.values()];
}

// Filtra a lista já agregada por serviço (aggregateCaixasPorServico),
// devolvendo só as caixas cujo Serviço, na linha de origem, é o pedido.
// Testado em caixas-por-servico.test.mjs.
function caixasDoServico(caixasAgregadas, servNome) {
  return caixasAgregadas.filter(c => c.servNome === servNome);
}

// Soma, por supermercado, os totais já agregados (máximos) de cada tipo de
// caixa — "quantidade total por supermercado".
function totaisPorSupermercado(caixasAgregadas) {
  const totais = {};
  for (const c of caixasAgregadas) {
    totais[c.superNome] = (totais[c.superNome] || 0) + (Number(c.qtdTotal) || 0);
  }
  return totais;
}

// Supermercado com o maior total agregado — usado no cartão "Maior total
// por supermercado" do resumo.
function maiorTotalSupermercado(totais) {
  let nome = '', valor = -1;
  for (const [k, v] of Object.entries(totais)) {
    if (v > valor) { nome = k; valor = v; }
  }
  return valor >= 0 ? { nome, valor } : null;
}

// Para cada grupo (HPH / ACES / Outro), a maior "Quantidade Caixa" de cada
// tipo de caixa entre os supermercados desse grupo, ordenada alfabeticamente
// por tipo — usada na secção "Caixas por supermercado", agora organizada
// por grupo.
// Importante: usa "Quantidade Caixa" (capacidade — quantas unidades cabem
// numa caixa desse tipo), não "Quantidade Total" (quantidade total desse
// tipo de caixa naquele supermercado, que pode somar várias caixas) — são
// coisas diferentes. "Quantidade Total" continua a ser usada só no cartão
// "Maior total por supermercado" (ver totaisPorSupermercado).
function maxPorTipoEGrupo(caixasAgregadas) {
  const porGrupo = {};
  for (const c of caixasAgregadas) {
    if (!porGrupo[c.grupo]) porGrupo[c.grupo] = new Map();
    const val = Number(c.qtdCx) || 0;
    const atual = porGrupo[c.grupo].get(c.tipoCx) || 0;
    if (val > atual) porGrupo[c.grupo].set(c.tipoCx, val);
  }
  const resultado = {};
  for (const [grupo, mapa] of Object.entries(porGrupo)) {
    resultado[grupo] = [...mapa.entries()]
      .map(([tipo, max]) => ({ tipo, max }))
      .sort((a, b) => a.tipo.localeCompare(b.tipo, 'pt'));
  }
  return resultado;
}
function processArmFile(headers, rows, fname) {
  const iCod      = col(headers, ['Código Artigo', 'Codigo Artigo']);
  const iDescArt  = col(headers, ['Descrição Artigo', 'Descricao Artigo']);
  const iCodArm   = col(headers, ['Código Armazém', 'Codigo Armazem']);
  const iNomeArm  = col(headers, ['Descrição Armazém', 'Descricao Armazem', 'Armazém']);
  const iZona     = col(headers, ['Zona']);
  const iDescZona = col(headers, ['Descrição Zona', 'Descricao Zona']);
  const iUM       = col(headers, ['Unidade de Medida']);
  const iObs      = col(headers, ['Obs']);
  const iStock    = col(headers, ['Stockável', 'Stockavel']);
  const iPreco    = col(headers, ['Preço Médio Artigo', 'Preco Medio Artigo']);

  armMap = {};
  rows.forEach(r => {
    const cod = v(r, iCod);
    if (!cod) return;
    if (!armMap[cod]) armMap[cod] = { descArtigo: '', posicoes: [], stockavel: '', precoMedio: '' };
    const desc = v(r, iDescArt);
    if (desc && !armMap[cod].descArtigo) armMap[cod].descArtigo = desc;
    // Stockável e Preço Médio são propriedades do artigo (não da posição);
    // guarda-se a primeira ocorrência não-vazia de cada.
    const stock = v(r, iStock);
    if (stock && !armMap[cod].stockavel) armMap[cod].stockavel = stock;
    const preco = v(r, iPreco);
    if (preco !== '' && armMap[cod].precoMedio === '') armMap[cod].precoMedio = preco;
    const entry = { codArm: v(r, iCodArm), nomeArm: v(r, iNomeArm), zona: v(r, iZona), descZona: v(r, iDescZona), um: v(r, iUM), obs: v(r, iObs) };
    if (entry.nomeArm && !armMap[cod].posicoes.find(p => p.nomeArm === entry.nomeArm && p.descZona === entry.descZona))
      armMap[cod].posicoes.push(entry);
  });

  armLoaded = true;
  invalidarIndicePesquisa();
  markLoaded('z-arm', 'count-arm', fname, Object.keys(armMap).length + ' artigos', 'arm');
  checkReady();
}

// ── Etiqueta: regras de negócio (funções puras) ─────────
// Testadas em etiqueta.test.mjs.
//
// Cor de fundo do código+descrição, por regra de negócio. A ORDEM importa:
// "a pedido" (rosa) é o caso mais específico e é testado ANTES de amarelo —
// senão qualquer N cairia logo em amarelo.
//   Stockável = S           → branco  (artigo de stock)
//   Stockável = N + Zona ENC → rosa   (artigo a pedido)
//   Stockável = N            → amarelo (não-stockável)
function corDaEtiqueta(stockavel, descZonas) {
  const s = String(stockavel || '').trim().toUpperCase();
  if (s === 'S') return 'branco';
  const temEnc = (descZonas || []).some(z => String(z || '').trim().toUpperCase() === 'ENC');
  if (temEnc) return 'rosa';
  return 'amarelo';
}

// Conteúdo do QR Code: código + posição + supermercado, separados por "|".
function dadosQrEtiqueta(cod, posicao, supermercado) {
  return [cod || '', posicao || '', supermercado || ''].join('|');
}

// Preço médio formatado (vírgula decimal PT, símbolo €). Vazio → travessão.
function formatarPreco(valor) {
  if (valor === '' || valor === undefined || valor === null) return '—';
  const num = Number(valor);
  if (!isFinite(num)) return '—';
  return num.toFixed(2).replace('.', ',') + ' €';
}

// ── Persistência local (IndexedDB) ──────────────────────
// Guarda os bytes originais dos dois ficheiros Excel no próprio
// dispositivo, para não ser preciso voltar a carregá-los depois de um
// refresh, fechar/abrir o browser, ou reabrir a app instalada. Nada disto
// sai do dispositivo — é só armazenamento local do browser (IndexedDB, que
// ao contrário do localStorage aguenta bem ficheiros de vários MB).
// Guarda-se sempre o ficheiro em bruto (não os dados já processados) para
// reutilizar exatamente a mesma lógica de leitura (processFileBuffer) nos
// dois casos — upload manual e carregamento automático — evitando ter duas
// vias de processamento que podiam divergir no futuro.
const DB_NOME  = 'consulta-artigos-db';
const DB_STORE = 'ficheiros';

function abrirFicheirosDB() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { reject(new Error('IndexedDB não suportado neste browser')); return; }
    const req = indexedDB.open(DB_NOME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(DB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => reject(req.error);
  });
}

// Guarda (ou substitui, se já existir) os bytes de um ficheiro para o tipo
// indicado ('super' ou 'arm'). Falhas aqui nunca interrompem a app — só
// significam que, da próxima vez, vai ser preciso carregar o ficheiro à
// mão outra vez, tal como acontecia antes desta funcionalidade existir.
async function guardarFicheiroDB(tipo, arrayBuffer, fname) {
  try {
    const db = await abrirFicheirosDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put({ arrayBuffer, fname }, tipo);
      tx.oncomplete = resolve;
      tx.onerror    = () => reject(tx.error);
    });
    db.close();
  } catch (err) {
    console.warn('Não foi possível guardar o ficheiro localmente (a app continua a funcionar normalmente, só sem retomar automaticamente da próxima vez):', err);
  }
}

// Lê o registo guardado para um tipo ('super' ou 'arm'). Devolve null se
// não houver nada guardado, ou se a leitura falhar por qualquer razão
// (ex: IndexedDB bloqueado em modo de navegação privada).
async function lerFicheiroDB(tipo) {
  try {
    const db = await abrirFicheirosDB();
    const resultado = await new Promise((resolve, reject) => {
      const tx  = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).get(tipo);
