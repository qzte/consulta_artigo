// ou botões de filtro ("Todas" + um por valor, quando há 2 ou mais
// distintos). Usada da mesma forma nos índices de Supermercado e Serviço,
// para os dois terem sempre os mesmos badges.
function dimensaoBadgeOuFiltro(dim, label, artigos) {
  const valores = [...new Set(artigos.map(a => a[dim]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt'));
  if (!valores.length) return { badge: '', filtro: '' };
  if (valores.length === 1) return { badge: ` <span class="super-tag">${escHtml(valores[0])}</span>`, filtro: '' };
  const botoes = [`<button type="button" class="area-btn filtro-btn active" data-dim="${dim}" data-val="" onclick="toggleFiltro(this)">Todas</button>`]
    .concat(valores.map(v => `<button type="button" class="area-btn filtro-btn" data-dim="${dim}" data-val="${escHtml(v)}" onclick="toggleFiltro(this)">${escHtml(v)}</button>`))
    .join('');
  return { badge: '', filtro: `<div class="area-filter-row" title="${escHtml(label)}">${botoes}</div>` };
}

// Ficha de índice para o modo "Supermercados / Serviços": uma ficha por
// supermercado (ou serviço) encontrado, com uma linha por artigo — em vez
// da ficha de artigo usada no modo "Artigos" (renderCard, abaixo).
function renderSuperGroupCard(entry, tipo) {
  const isSuper = tipo === 'supermercado';
  const labelTipo = isSuper ? 'Supermercado' : 'Serviço';
  const posLabel = isSuper ? 'Posição no supermercado' : 'Posição no serviço';

  // Local (HPH/ACES) e Área tratados da mesma forma nos dois índices: se
  // os artigos da ficha só têm um valor distinto, mostra-se como badge
  // fixo junto ao nome (não há nada para filtrar); se há mais que um,
  // mostra-se como botões de filtro ("Todas" + um por valor).
  const grupoInfo = dimensaoBadgeOuFiltro('grupo', 'Local', entry.artigos);
  const areaInfo  = dimensaoBadgeOuFiltro('area', 'Área', entry.artigos);

  // Seleção em lote de etiquetas: só nas fichas de SUPERMERCADO (a
  // etiqueta precisa do par supermercado+posição; serviços ficam de fora).
  // Ao mudar de supermercado, a seleção anterior é limpa.
  if (isSuper) {
    const key = (entry.cod || '') + '|' + entry.nome;
    if (key !== etqLoteKeyAtual) { etqLoteKeyAtual = key; etqLoteSel = new Set(); }
    etqLoteEntryAtual = entry;
  }

  const linhas = entry.artigos
    .slice()
    .sort(compareIndexArtigos)
    .map(art => {
      const caixasHtml = art.caixas.length
        ? art.caixas.slice()
            .sort((a, b) => a.tipoCx.localeCompare(b.tipoCx, 'pt'))
            .map(c => `<span class="badge-total" title="${escHtml(c.tipoCx)}">${escHtml(c.tipoCx)}: ${escHtml(c.qtdTotal || 0)}</span>`)
            .join(' ')
        : '<span class="no-data">—</span>';
      const posHtml = art.posicaoTexto
        ? escHtml(art.posicaoTexto)
        : '<span class="no-data">—</span>';
      const cbHtml = isSuper
        ? `<td class="etq-lote-td"><input type="checkbox" class="etq-lote-cb" data-cod="${escHtml(art.cod)}"${etqLoteSel.has(art.cod) ? ' checked' : ''} onchange="toggleEtqLote(this)" title="Marcar para emitir etiqueta"></td>`
        : '';
      return `<tr data-area="${escHtml(art.area || '')}" data-grupo="${escHtml(art.grupo || '')}">
        ${cbHtml}<td class="mono"><button type="button" class="cod-link" data-cod="${escHtml(art.cod)}" onclick="irParaArtigoNoIndice(this.dataset.cod)" title="Ver ficha deste artigo">${escHtml(art.cod)}</button></td>
        <td>${escHtml(art.nome || '—')}</td>
        <td>${caixasHtml}</td>
        <td class="muted">${posHtml}</td>
      </tr>`;
    }).join('');

  return `<div class="artigo-card">
    <div class="artigo-card-header">
      <span class="cod-pill">${escHtml(entry.cod || '—')}</span>
      <div class="sgc-header-main">
        <span class="artigo-nome">${escHtml(entry.nome)}${grupoInfo.badge}${areaInfo.badge}</span>
        ${grupoInfo.filtro}${areaInfo.filtro}
      </div>
    </div>
    <div class="artigo-card-body">
      <div class="sec-label">${escHtml(labelTipo)} — <span class="sec-count" data-total="${entry.artigos.length}">${entry.artigos.length} artigo(s)</span></div>
      <div class="cx-wrap">
        <table class="cx">
          <thead><tr>
            ${isSuper ? '<th class="etq-lote-td" title="Marcar artigos para emitir etiquetas">🏷</th>' : ''}
            <th class="sortable" onclick="setIndexSort('cod')">Código${sortArrowHtml('cod')}</th>
            <th class="sortable" onclick="setIndexSort('artigo')">Artigo${sortArrowHtml('artigo')}</th>
            <th>Caixa / Quantidade</th>
            <th class="sortable" onclick="setIndexSort('posicao')">${escHtml(posLabel)}${sortArrowHtml('posicao')}</th>
          </tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>
      ${isSuper ? `<div class="etq-lote-bar" id="etq-lote-bar" style="display:${etqLoteSel.size ? 'flex' : 'none'}"><button type="button" class="etq-print-btn" onclick="imprimirEtiquetasLote()">Imprimir etiquetas (<span id="etq-lote-count">${etqLoteSel.size}</span>)</button></div>` : ''}
    </div>
  </div>`;
}

function renderCard(cod) {
  const s    = superMap[cod] || { supermercados: [], caixas: [] };
  const a    = armMap[cod]   || { posicoes: [] };
  const nome = getNome(cod);

  // ── Armazém block ──
  const armHTML = a.posicoes.length
    ? `<div class="arm-grid">${a.posicoes.map(p => `
        <div class="arm-cell">
          <div class="arm-cell-name">${escHtml(p.nomeArm || p.codArm)}</div>
          <div class="arm-cell-pos">${escHtml(p.descZona || p.zona || '—')}</div>
          ${p.um  ? `<div class="arm-cell-um">UM: ${escHtml(p.um)}</div>` : ''}
          ${p.obs ? `<div class="arm-cell-obs">${escHtml(p.obs)}</div>` : ''}
        </div>`).join('')}</div>`
    : '<span class="no-data">Sem dados de armazém</span>';

  // ── Supermercados block (agrupado por Local: HPH / ACES / Outro) ──
  let superHTML = '<span class="no-data">Não associado a supermercados</span>';
  if (s.supermercados.length) {
    const ordem = ['HPH', 'ACES', 'Outro'];
    const grupos = {};
    s.supermercados.forEach(sv => {
      if (!grupos[sv.grupo]) grupos[sv.grupo] = [];
      grupos[sv.grupo].push(sv);
    });
    superHTML = ordem.filter(g => grupos[g] && grupos[g].length).map(g => `
      <div class="super-group">
        <div class="super-group-label">${escHtml(g)} (${grupos[g].length})</div>
        <div class="super-tags">${ordenarSupermercadosAlfabeticamente(grupos[g]).map(sv =>
          `<button type="button" class="super-tag super-tag-btn" data-cod="${escHtml(sv.cod)}" data-nome="${escHtml(sv.nome)}" onclick="irParaSupermercadoNoIndice(this.dataset.cod, this.dataset.nome)" title="${sv.local ? 'Local: ' + escHtml(sv.local) + ' — ' : ''}Ver índice deste supermercado">${escHtml(sv.nome)}${sv.cod ? ' (' + escHtml(sv.cod) + ')' : ''}</button>`
        ).join('')}</div>
      </div>`).join('');
  }

  // ── Caixas por grupo (HPH / ACES / Outro) ──
  let cxHTML = '';
  if (s.caixas.length) {
    const porGrupo = maxPorTipoEGrupo(s.caixas);
    const ordemGrupos = ['HPH', 'ACES', 'Outro'];
    const colunas = ordemGrupos
      .filter(g => porGrupo[g] && porGrupo[g].length)
      .map(g => `
        <div class="cxgrp-col">
          <div class="cxgrp-title">${escHtml(g)}</div>
          ${porGrupo[g].map(t => `
            <div class="cxgrp-row">
              <span class="cxgrp-tipo">${escHtml(t.tipo)}</span>
              <span class="badge-total">${escHtml(t.max)}</span>
            </div>`).join('')}
        </div>`).join('');
    cxHTML = `
      <div>
        <div class="sec-label">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          Caixas por supermercado
        </div>
        <div class="cxgrp-grid">${colunas}</div>
      </div>`;
  }

  // ── Painel "Informação importante" (Armazém e Posição → Supermercados
  // com Artigo → Maior total por supermercado) ──
  let infoHTML = '';
  if (s.supermercados.length || s.caixas.length || a.posicoes.length) {
    const totais = totaisPorSupermercado(s.caixas);
    const maior  = maiorTotalSupermercado(totais);

    // Contagem de supermercados por grupo (HPH / ACES / Outro)
    const contagemGrupos = {};
    s.supermercados.forEach(sv => { contagemGrupos[sv.grupo] = (contagemGrupos[sv.grupo] || 0) + 1; });
    const ordemGrupos = ['HPH', 'ACES', 'Outro'];
    const listaGrupos = ordemGrupos
      .filter(g => contagemGrupos[g])
      .map(g => `${contagemGrupos[g]} ${escHtml(g)}`)
      .join(', ') || '—';

    infoHTML = `
      <div>
        <div class="sec-label">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          Informação importante
        </div>
        <div class="info-grid">
          <div class="info-card neutral">
            <div class="info-card-title">Armazém e Posição</div>
            ${armHTML}
          </div>
          <div class="info-card blue">
            <div class="info-card-title">Supermercados com artigo</div>
            <div class="info-card-num">${s.supermercados.length}</div>
            <div class="info-card-detail">${listaGrupos}</div>
          </div>
          <div class="info-card amber">
            <div class="info-card-title">Maior total por supermercado</div>
            <div class="info-card-num">${maior ? escHtml(maior.valor) : '—'}</div>
            <div class="info-card-detail">${maior ? escHtml(maior.nome) : '—'}</div>
          </div>
        </div>
      </div>
      <hr class="divider">`;
  }

  return `<div class="artigo-card">
    <div class="artigo-card-header">
      <span class="cod-pill">${escHtml(cod)}</span>
      <span class="artigo-nome">${escHtml(nome || '—')}</span>
    </div>
    <div class="artigo-card-body">
      ${infoHTML}
      ${cxHTML ? `${cxHTML}<hr class="divider">` : ''}
      <div>
        <div class="sec-label">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Supermercados
        </div>
        ${superHTML}
      </div>
    </div>
  </div>`;
}

// ── PWA: registo do Service Worker ──────────────────────
// Regista o sw.js (ficheiro à parte, tem de estar na mesma pasta do HTML
// no GitHub Pages) para a app ficar instalável e funcionar offline depois
// da primeira visita. Feito com "load" para não atrasar o arranque da
// página, e protegido por "in navigator" para não rebentar em navegadores
// sem suporte a Service Worker.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('Falha ao registar o Service Worker (a app continua a funcionar normalmente, só sem modo offline):', err);
    });
  });
}
</script>
