name: CI

# A app é um único HTML servido pelo GitHub Pages, sem build nem
# dependências. Os testes usam só o test runner que vem com o Node, por isso
# não há "npm install" nenhum a fazer aqui — e não há um package-lock.json
# para manter.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Correr os testes
        run: npm test

  # O index.html é o ficheiro que vai para o ar. Se tiver um erro de sintaxe
  # no <script>, a app abre em branco e nenhum teste de função pura dá por
  # isso — eles extraem só as funções de que precisam e não olham para o
  # resto do ficheiro.
  sintaxe:
    name: Sintaxe do index.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar o <script> do index.html
        run: node tests/verificar-sintaxe.mjs
